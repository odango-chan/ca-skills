apiVersion: connectionagent.io/v1alpha1
kind: EvidenceRules
metadata:
  skill: wifi-file-transfer
predicates:
  wifi_transfer.request.satisfied:
    requiredObservations:
      transfer:
        ref: wifi.transfer.snapshot
      qosBoost:
        ref: wifi.qos.boost_state
        when: request.urgency == "urgent"
    freshness:
      maxAge: 5s
    acquisition:
      transfer:
        preferred:
        - source: runtime_state
        - source: signaling_observation
        activeObservation:
          ref: wifi.transfer.status
      qosBoost:
        preferred:
        - source: tool_result
          ref: wifi.qos.boost
