apiVersion: connectionagent.io/v1alpha1
kind: PredicateDefinitions
metadata:
  skill: wifi-file-transfer
predicates:
  transfer.intent.urgent:
    evaluator:
      type: cel
      expression: request.urgency == "urgent"
      passReasonCode: TRANSFER_URGENT
      failReasonCode: TRANSFER_NOT_URGENT

  wifi_transfer.request.satisfied:
    evaluator:
      type: cel
      expression: >
        observations.transfer.state == "CREATED" &&
        (request.urgency == "normal" ||
         observations.qosBoost.state == "COMMITTED")
      passReasonCode: WIFI_TRANSFER_REQUEST_SATISFIED
      failReasonCode: WIFI_TRANSFER_REQUEST_NOT_SATISFIED
