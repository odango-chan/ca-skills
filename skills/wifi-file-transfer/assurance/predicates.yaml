apiVersion: connectionagent.io/v1alpha1
kind: PredicateSet
metadata:
  skill: wifi-file-transfer
predicates:
  wifi_transfer.request.satisfied:
    observations:
      transfer:
        ref: wifi.transfer.snapshot
        scope: >
          {
            "requestId": request.requestId,
            "transferId": facts["wifi_transfer.id"]
          }
        freshness: 5s
      qosBoost:
        ref: wifi.qos.boost_state
        scope: >
          {"transferId": facts["wifi_transfer.id"]}
        freshness: 5s
        when: request.urgency == "urgent"
    evaluator:
      type: cel
      expression: >
        observations.transfer.state == "CREATED" &&
        (request.urgency == "normal" ||
         observations.qosBoost.state == "COMMITTED")
