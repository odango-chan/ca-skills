apiVersion: connectionagent.io/v1alpha1
kind: SkillContract
metadata:
  name: wifi-file-transfer
spec:
  skillType: executable
  goal: wifi_file_transfer.orchestrate
  inputs:
    requestSchema: schemas/wifi-transfer-request.schema.yaml
  context:
    requiredFacts:
    - transfer.intent.urgent
    - wifi_transfer.request.satisfied
  allowedResources:
    capabilities:
    - wifi.transfer.create
    - wifi.transfer.status
    - wifi.qos.boost
    localTools: []
  requirements:
  - predicate: wifi_transfer.request.satisfied
    expect: PASS
    satisfiable: true
  postconditions:
  - predicate: wifi_transfer.request.satisfied
    expect: PASS
  planning:
    maxActions: 3
    allowDynamicProcedure: false
