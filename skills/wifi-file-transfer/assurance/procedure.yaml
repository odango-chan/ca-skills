procedures:
  create-wifi-transfer-normal:
    applicability:
      when: request.urgency == "normal"
    start: create-transfer
    nodes:
      create-transfer:
        call: wifi.transfer.create
        with:
          requestId:
            from: input.request-id
          senderId:
            from: input.sender-id
          receiverIds:
            from: input.receiver-ids
        'on':
          COMMITTED: verify-goal
          NOT_COMMITTED: failed
          OUTCOME_UNKNOWN: safe-stopped
          FAILED: failed
          DENIED: failed
      verify-goal:
        verify: wifi_transfer.request.satisfied
        'on':
          PASS: done
          FAIL: failed
          UNKNOWN: unresolved
      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
      unresolved:
        terminal: UNRESOLVED
      safe-stopped:
        terminal: SAFE_STOPPED
    inputs:
      receiver-ids:
        type: array
        from: context.request.receiverIds
      request-id:
        type: string
        from: context.request.requestId
      sender-id:
        type: string
        from: context.request.senderId
  create-wifi-transfer-urgent:
    applicability:
      when: request.urgency == "urgent"
    start: create-transfer
    nodes:
      create-transfer:
        call: wifi.transfer.create
        with:
          requestId:
            from: input.request-id
          senderId:
            from: input.sender-id
          receiverIds:
            from: input.receiver-ids
        'on':
          COMMITTED: qos-boost
          NOT_COMMITTED: failed
          OUTCOME_UNKNOWN: safe-stopped
          FAILED: failed
          DENIED: failed
      qos-boost:
        call: wifi.qos.boost
        with:
          transferId:
            from: input.wifi-transfer-id
        'on':
          COMMITTED: verify-goal
          NOT_COMMITTED: failed
          OUTCOME_UNKNOWN: safe-stopped
          FAILED: failed
          DENIED: failed
      verify-goal:
        verify: wifi_transfer.request.satisfied
        'on':
          PASS: done
          FAIL: failed
          UNKNOWN: unresolved
      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
      unresolved:
        terminal: UNRESOLVED
      safe-stopped:
        terminal: SAFE_STOPPED
    inputs:
      receiver-ids:
        type: array
        from: context.request.receiverIds
      request-id:
        type: string
        from: context.request.requestId
      sender-id:
        type: string
        from: context.request.senderId
      wifi-transfer-id:
        type: string
        from: context.facts.wifi_transfer.id
