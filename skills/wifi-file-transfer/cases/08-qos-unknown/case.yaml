apiVersion: connectionagent.io/v1alpha1
kind: SkillTestCase
metadata:
  skill: wifi-file-transfer
  name: 08-qos-unknown
spec:
  classes:
  - outcome_unknown_safe_stopped
  purpose: QoS 结果未知时停止，不把传输创建成功当作加急成功。
  context:
    apiVersion: connectionagent.io/v1alpha1
    kind: PlanningContext
    metadata:
      operationId: op-08-qos-unknown
      version: 1
    subject:
      senderId: '001019876543210'
    request:
      requestId: wifi-source-001
      senderId: '001019876543210'
      receiverIds:
      - '001019876543211'
      urgency: urgent
    facts:
      wifi_transfer.id:
        value: wifi-transfer-001
    availableResources:
    - ref: wifi.transfer.create
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: wifi.qos.boost
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    constraints:
      maxActions: 3
  expect:
    procedure: create-wifi-transfer-urgent
    planningStatus: READY
    terminal: SAFE_STOPPED
    postconditions:
    - predicate: wifi_transfer.request.satisfied
      expect: PASS
      actual: NOT_EVALUATED
  fixtures:
    actions:
      create-transfer: COMMITTED
      qos-boost: OUTCOME_UNKNOWN
