$schema: https://json-schema.org/draft/2020-12/schema
$id: wifi-transfer-request.schema.yaml
title: WiFiFileTransferRequest
type: object
required:
- requestId
- senderId
- receiverIds
- urgency
properties:
  requestId:
    type: string
    minLength: 1
    description: Stable gateway correlation key for this transfer-creation request.
  senderId:
    type: string
    pattern: '^[0-9]{15}$'
  receiverIds:
    type: array
    minItems: 1
    maxItems: 16
    uniqueItems: true
    description: Bounded canonical receiver IDs resolved from the live roster before deterministic execution. The sender must not appear in this list.
    items:
      type: string
      pattern: '^[0-9]{15}$'
  urgency:
    type: string
    enum: [normal, urgent]
    description: Canonical urgency derived from the original user intent before deterministic execution.
additionalProperties: false
