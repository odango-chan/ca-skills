ue-requested-pdu-session-establishment:
  inputs:
    ue-ref:
      from: context.ueRef
    psi:
      from: context.request.pduSessionId
    pti:
      from: context.request.pti
    request-type:
      from: context.request.requestType
    dnn:
      from: context.request.dnn
    slice:
      from: context.request.sNssai
    plmn:
      from: context.request.servingPlmn
    ingress-ref:
      from: context.correlation.ingressRef
    lifecycle-ref:
      from: context.correlation.lifecycleRef
    requested-type:
      from: context.request.requestedPduSessionType
    requested-ssc:
      from: context.request.requestedSscMode

  start: nudm-sdm-get

  nodes:
    nudm-sdm-get:
      call: createdsession-tools::sbi.udm.sm_data.get
      with:
        ueRef:
          from: input.ue-ref
        dnn:
          from: input.dnn
        sNssai:
          from: input.slice
        servingPlmn:
          from: input.plmn
      postconditions:
        steps:
          - verify: createdsession.udm.subscription_usable
            with:
              udmReadResult:
                from: nudm-sdm-get.output.result
        'on':
          PASS: nudm-sdm-subscribe
          FAIL: failed
          UNKNOWN: unresolved
      'on':
        FAILED: failed
        DENIED: failed
        UNKNOWN: unresolved

    nudm-sdm-subscribe:
      preconditions:
        steps:
          # Shared procedure data, consumed later by PCF Create and AMF delivery
          # preparation.
          - name: select-subscription-configuration
            script: scripts/select_establishment_configuration.py
            with:
              dnn:
                from: input.dnn
              sNssai:
                from: input.slice
              requestedPduSessionType:
                from: input.requested-type
              requestedSscMode:
                from: input.requested-ssc
              udmResult:
                from: nudm-sdm-get.output.result

          # UDM Subscribe is answered from UDM-owned evidence only. A PCF
          # create inputs handle cannot exist yet: the SMF only starts the
          # PCF create after this subscription is answered, and the held
          # Fabric PCF hold does not exist before that. Requiring the future
          # handle here made the subscription depend on its own successor.
          #
          # The SMF's own UDM SDM subscription create is held by Fabric. The
          # Runtime may only present a hold reference Fabric issued for this
          # exact environment, lifecycle, SUPI, DNN and S-NSSAI. The UDM hold
          # declares no PDU Session and no policy association, so neither is
          # required or inferred here.
          - name: bind-udm-hold
            call: createdsession-tools::ca.session.udm_hold.bind
            with:
              ueRef:
                from: input.ue-ref
              dnn:
                from: input.dnn
              snssai:
                from: input.slice
              ingressRef:
                from: input.ingress-ref
              lifecycleRef:
                from: input.lifecycle-ref

          - verify: createdsession.udm.hold_bound
            with:
              hold:
                from: preconditions.bind-udm-hold.output
              dnn:
                from: input.dnn
              sst:
                from: input.slice.sst

          - name: read-lifecycle-before-udm-subscribe
            call: ca-agent-host::ca.session.lifecycle.registration.read
            with:
              ueRef:
                from: input.ue-ref
              lifecycleRef:
                from: input.lifecycle-ref

          - verify: createdsession.lifecycle.ready
            with:
              lifecycle:
                from: preconditions.read-lifecycle-before-udm-subscribe.output
              expectedLifecycleRef:
                from: input.lifecycle-ref
        'on':
          FAILED: failed
          UNRESOLVED: unresolved

      call: createdsession-tools::sbi.udm.sdm_subscription.create
      with:
        # The exact Provider UDM read that this attempt performed. The
        # Runtime resolves the stored record by subject/invocation/transaction
        # and refuses a selection that was not derived from it.
        ueRef:
          from: input.ue-ref
        udmInvocationRef:
          from: nudm-sdm-get.output.invocationId
        udmTransactionRef:
          from: nudm-sdm-get.output.result.transactionRef
        selection:
          from: preconditions.select-subscription-configuration.output
        ingressRef:
          from: input.ingress-ref
        lifecycleRef:
          from: input.lifecycle-ref
        # The subscribe answers exactly the held SMF waiter whose identity was
        # bound above. The Runtime claims that waiter after its operation
        # identity and commitment exist, immediately before this mutation.
        waiterRef:
          from: preconditions.bind-udm-hold.output.holdRef
      postconditions:
        steps:
          - verify: createdsession.udm.subscription_owned
            with:
              subscription:
                from: nudm-sdm-subscribe.output
        'on':
          PASS: npcf-sm-policy-control-create
          FAIL: finalize-failed
          UNKNOWN: finalize-unresolved
      'on':
        NOT_COMMITTED: finalize-failed
        OUTCOME_UNKNOWN: reconcile-nudm-sdm-subscribe
        FAILED: finalize-failed
        DENIED: finalize-failed

    npcf-sm-policy-control-create:
      preconditions:
        steps:
          # PCF Hold Binding. The SMF's original PCF create is held by Fabric
          # and only exists after UDM Subscribe is answered, so binding it is
          # a step of the create, not of the subscription. The Runtime may
          # only present a hold reference Fabric issued and that matches this
          # exact environment/lifecycle/UE/PDU Session.
          - name: bind-pcf-hold
            call: createdsession-tools::ca.session.pcf_hold.bind
            with:
              ueRef:
                from: input.ue-ref
              pduSessionId:
                from: input.psi
              ingressRef:
                from: input.ingress-ref
              lifecycleRef:
                from: input.lifecycle-ref

          - verify: createdsession.pcf.hold_bound
            with:
              hold:
                from: preconditions.bind-pcf-hold.output

          # Pre-N4 inputs are prepared from that exact held request. Input
          # readiness is still only readiness: it never authorizes a create.
          - name: resolve-pcf-create-inputs
            call: createdsession-tools::ca.session.pcf_create_inputs.read
            with:
              ueRef:
                from: input.ue-ref
              pduSessionId:
                from: input.psi
              pti:
                from: input.pti
              requestType:
                from: input.request-type
              ingressRef:
                from: input.ingress-ref
              lifecycleRef:
                from: input.lifecycle-ref
              fabricHoldRef:
                from: preconditions.bind-pcf-hold.output.holdRef
              selection:
                from: nudm-sdm-subscribe.preconditions.select-subscription-configuration.output

          - verify: createdsession.pcf.create_inputs.ready
            with:
              pcfCreateInputs:
                from: preconditions.resolve-pcf-create-inputs.output
              pcfHold:
                from: preconditions.bind-pcf-hold.output

          # Which verified subscription values become PCF policy inputs is a
          # Skill business choice. The script selects them; the Provider
          # projection, owner ranges and hold/handle checks stay in the
          # Backend and are not widened by this output.
          - name: build-pcf-policy-inputs
            script: scripts/build_pcf_policy_inputs.py
            with:
              subscriptionData:
                from: nudm-sdm-subscribe.preconditions.select-subscription-configuration.output.subscriptionData
              subscriptionSource:
                from: nudm-sdm-subscribe.preconditions.select-subscription-configuration.output.subscriptionSource

          # The Pre-N4 baseline is captured immediately before the PCF Create
          # mutation. It must be a complete exact SMF read for this SUPI/PSI.
          # Only a proven no-pair state is admissible: an existing pair, an
          # unavailable read or an ambiguous read blocks the create instead of
          # being guessed. The baseline is keyed to this exact Pre-N4 policy
          # association and lifecycle, not to an N4 instance.
          - name: read-n4-baseline
            call: createdsession-tools::ca.session.n4.initial_resources.read
            with:
              ueRef:
                from: input.ue-ref
              pduSessionId:
                from: input.psi
              pti:
                from: input.pti
              requestType:
                from: input.request-type
              ingressRef:
                from: input.ingress-ref
              lifecycleRef:
                from: input.lifecycle-ref
              pcfPolicyAssociationRef:
                from: preconditions.resolve-pcf-create-inputs.output.pcfPolicyAssociationRef
              fabricHoldRef:
                from: preconditions.bind-pcf-hold.output.holdRef
              phase:
                value: PRE_CREATE

          - verify: createdsession.n4.baseline_clear
            with:
              baseline:
                from: preconditions.read-n4-baseline.output

          # Create safety is a direct Fabric-owned governance READ. Its result
          # is scoped to this exact ingress, lifecycle, UE and PDU Session.
          - name: read-pcf-create-governance
            call: env-fabric-tools::ca.session.pcf_create_governance.read
            with:
              # Fabric's governance endpoint is keyed by the exact held waiter.
              # The hold binding above is the authority for that waiter; do not
              # ask Fabric to rediscover it from a broader UE/session selector.
              holdRef:
                from: preconditions.bind-pcf-hold.output.holdRef

          - verify: createdsession.pcf.create_governed
            with:
              governance:
                from: preconditions.read-pcf-create-governance.output

          - name: read-lifecycle-before-pcf-create
            call: ca-agent-host::ca.session.lifecycle.registration.read
            with:
              ueRef:
                from: input.ue-ref
              lifecycleRef:
                from: input.lifecycle-ref

          - verify: createdsession.lifecycle.ready
            with:
              lifecycle:
                from: preconditions.read-lifecycle-before-pcf-create.output
              expectedLifecycleRef:
                from: input.lifecycle-ref
        'on':
          FAILED: finalize-failed
          UNRESOLVED: finalize-unresolved

      call: createdsession-tools::sbi.pcf.sm_policy.create
      with:
        # Explicit business binding; the Runtime cross-checks it against the
        # trusted ingress subject and the owner Pre-N4 inputs handle below.
        ueRef:
          from: input.ue-ref
        pcfCreateInputsRef:
          from: preconditions.resolve-pcf-create-inputs.output.pcfCreateInputsRef
        selection:
          from: nudm-sdm-subscribe.preconditions.select-subscription-configuration.output
        policyInputs:
          from: preconditions.build-pcf-policy-inputs.output
        lifecycleRef:
          from: input.lifecycle-ref
        sdmSubscriptionRef:
          from: nudm-sdm-subscribe.output.subscriptionRef
        # The create answers exactly the held SMF waiter whose inputs it read.
        # The Runtime claims that waiter after its operation identity and
        # commitment exist, immediately before this mutation.
        waiterRef:
          from: preconditions.bind-pcf-hold.output.holdRef
      postconditions:
        steps:
          - verify: createdsession.pcf.association_owned
            with:
              association:
                from: npcf-sm-policy-control-create.output
        'on':
          PASS: n4-session-establishment
          FAIL: finalize-failed
          UNKNOWN: finalize-unresolved
      'on':
        NOT_COMMITTED: finalize-failed
        OUTCOME_UNKNOWN: reconcile-npcf-sm-policy-control-create
        FAILED: finalize-failed
        DENIED: finalize-failed

    wait-initial-resources:
      call: ca-agent-host::ca.session.evidence.await
      with:
        targetOperationId:
          value: createdsession-tools::ca.session.n4.initial_resources.read
        ueRef:
          from: input.ue-ref
        pduSessionId:
          from: input.psi
        pti:
          from: input.pti
        requestType:
          from: input.request-type
        ingressRef:
          from: input.ingress-ref
        lifecycleRef:
          from: input.lifecycle-ref
        pcfPolicyAssociationRef:
          from: npcf-sm-policy-control-create.preconditions.resolve-pcf-create-inputs.output.pcfPolicyAssociationRef
        phase:
          value: POST_CREATE
        baselineRef:
          from: npcf-sm-policy-control-create.preconditions.read-n4-baseline.output.baselineRef
        freshnessSeconds:
          value: 5
        absencePolicy:
          value: CONTINUE
      'on':
        SUCCEEDED: read-initial-resources
        UNRESOLVED: finalize-unresolved

    read-initial-resources:
      call: createdsession-tools::ca.session.n4.initial_resources.read
      with:
        ueRef:
          from: input.ue-ref
        pduSessionId:
          from: input.psi
        pti:
          from: input.pti
        requestType:
          from: input.request-type
        ingressRef:
          from: input.ingress-ref
        lifecycleRef:
          from: input.lifecycle-ref
        pcfPolicyAssociationRef:
          from: npcf-sm-policy-control-create.preconditions.resolve-pcf-create-inputs.output.pcfPolicyAssociationRef
        phase:
          value: POST_CREATE
        baselineRef:
          from: npcf-sm-policy-control-create.preconditions.read-n4-baseline.output.baselineRef
      postconditions:
        steps:
          - verify: createdsession.n4.initial_resources_ready
            with:
              resources:
                from: read-initial-resources.output
        'on':
          PASS: namf-communication-n1n2-message-transfer
          FAIL: finalize-failed
          UNKNOWN: finalize-unresolved
      'on':
        FAILED: finalize-unresolved
        DENIED: finalize-failed
        UNKNOWN: finalize-unresolved

    namf-communication-n1n2-message-transfer:
      preconditions:
        steps:
          # Shared procedure data, reused by AMF transfer and downstream
          # RAN/N4 convergence.
          - name: resolve-effective-session-configuration
            call: createdsession-tools::ca.session.operation_context.read
            with:
              ueRef:
                from: input.ue-ref
              pduSessionId:
                from: input.psi
              pti:
                from: input.pti
              requestType:
                from: input.request-type
              ingressRef:
                from: input.ingress-ref
              lifecycleRef:
                from: input.lifecycle-ref
              selection:
                from: nudm-sdm-subscribe.preconditions.select-subscription-configuration.output
              policyResultRef:
                from: npcf-sm-policy-control-create.output.policyResultRef
              purpose:
                value: nas-and-n2-delivery

          - verify: createdsession.delivery_context.ready
            with:
              context:
                from: preconditions.resolve-effective-session-configuration.output

          - name: prepare-establishment-response
            call: createdsession-tools::ca.session.establishment_response.prepare
            with:
              operationContextRef:
                from: preconditions.resolve-effective-session-configuration.output.contextRef
              runtimeInvocationRef:
                from: preconditions.resolve-effective-session-configuration.output.runtimeInvocationRef
              ueRef:
                from: input.ue-ref
              pduSessionId:
                from: input.psi
              pti:
                from: input.pti
              lifecycleRef:
                from: input.lifecycle-ref
              selection:
                from: nudm-sdm-subscribe.preconditions.select-subscription-configuration.output
              policyResultRef:
                from: npcf-sm-policy-control-create.output.policyResultRef

          # Which prepared N1/N2 material is delivered is a Skill business
          # choice. The Script selects the admitted SM profile and the exact
          # prepared digests for this attempt; the Tool input schema validates
          # the complete transfer request and the adapter proves the selected
          # material against its durable prepared-response record.
          - name: build-n1n2-delivery
            script: scripts/build_n1n2_delivery.py
            with:
              preparedResponse:
                from: preconditions.prepare-establishment-response.output
              operationContextRef:
                from: preconditions.resolve-effective-session-configuration.output.contextRef
              policyResultRef:
                from: npcf-sm-policy-control-create.output.policyResultRef
              pduSessionType:
                from: input.requested-type

          # The SMF's own N1/N2 Message Transfer is held by Fabric. Binding it
          # is a read: it selects the one hold whose published scope is this
          # exact environment/lifecycle/SUPI/PDU-Session and the operator AMF
          # target. It is bound after preparation so the short hold budget is
          # not spent while the NAS/N2 artifact is prepared, and it never
          # claims or sends anything.
          - name: bind-n1n2-hold
            call: createdsession-tools::ca.session.n1n2_hold.bind
            with:
              ueRef:
                from: input.ue-ref
              pduSessionId:
                from: input.psi
              ingressRef:
                from: input.ingress-ref
              lifecycleRef:
                from: input.lifecycle-ref

          - verify: createdsession.n1n2.hold_bound
            with:
              hold:
                from: preconditions.bind-n1n2-hold.output

        'on':
          FAILED: finalize-failed
          UNRESOLVED: finalize-unresolved

      call: createdsession-tools::sbi.amf.n1n2.transfer
      with:
        operationContextRef:
          from: preconditions.resolve-effective-session-configuration.output.contextRef
        runtimeInvocationRef:
          from: preconditions.resolve-effective-session-configuration.output.runtimeInvocationRef
        # Explicit business bindings for this attempt. The Runtime still
        # cross-checks both against the trusted ingress context and the exact
        # Fabric hold bound earlier, so a parent-local rename cannot change
        # which session or subject is sent.
        ueRef:
          from: input.ue-ref
        pduSessionId:
          from: input.psi
        lifecycleRef:
          from: input.lifecycle-ref
        responseArtifactRef:
          from: preconditions.prepare-establishment-response.output.responseArtifactRef
        # The N1/N2 delivery material selected by the admitted Script. The Tool
        # input schema validates the complete request before dispatch.
        delivery:
          from: preconditions.build-n1n2-delivery.output
        # The transfer answers exactly the held SMF waiter bound above. The
        # Runtime derives the Agent operation identity and commitment, records
        # them durably, claims that waiter, and only then dispatches with the
        # same association.
        waiterRef:
          from: preconditions.bind-n1n2-hold.output.holdRef
      postconditions:
        steps:
          - verify: createdsession.amf.transfer_initiated
            with:
              transferResult:
                from: namf-communication-n1n2-message-transfer.output
              expectedOperationRef:
                from: namf-communication-n1n2-message-transfer.output.operationRef
        'on':
          PASS: pdu-session-resource-setup
          FAIL: finalize-failed
          UNKNOWN: finalize-unresolved
      'on':
        NOT_COMMITTED: finalize-failed
        OUTCOME_UNKNOWN: reconcile-n1n2-message-transfer
        FAILED: finalize-failed
        DENIED: finalize-failed

    wait-ran-setup:
      call: ca-agent-host::ca.session.evidence.await
      with:
        targetOperationId:
          value: createdsession-tools::ca.session.ran_setup.read
        ueRef:
          from: input.ue-ref
        pduSessionId:
          from: input.psi
        pti:
          from: input.pti
        requestType:
          from: input.request-type
        ingressRef:
          from: input.ingress-ref
        lifecycleRef:
          from: input.lifecycle-ref
        currentSessionInstanceRef:
          from: read-initial-resources.output.currentSessionInstanceRef
        freshnessSeconds:
          value: 3600
        absencePolicy:
          value: RETURN
      'on':
        SUCCEEDED: read-ran-setup
        UNRESOLVED: finalize-unresolved

    read-ran-setup:
      call: createdsession-tools::ca.session.ran_setup.read
      with:
        ueRef:
          from: input.ue-ref
        pduSessionId:
          from: input.psi
        pti:
          from: input.pti
        requestType:
          from: input.request-type
        ingressRef:
          from: input.ingress-ref
        lifecycleRef:
          from: input.lifecycle-ref
        currentSessionInstanceRef:
          from: read-initial-resources.output.currentSessionInstanceRef
      postconditions:
        steps:
          - verify: createdsession.ran.setup_accepted
            with:
              setup:
                from: read-ran-setup.output
        'on':
          PASS: wait-n4-forwarding
          FAIL: finalize-failed
          UNKNOWN: finalize-unresolved
      'on':
        FAILED: finalize-unresolved
        DENIED: finalize-failed
        UNKNOWN: finalize-unresolved

    wait-n4-forwarding:
      call: ca-agent-host::ca.session.evidence.await
      with:
        targetOperationId:
          value: createdsession-tools::ca.session.n4.forwarding.read
        ueRef:
          from: input.ue-ref
        pduSessionId:
          from: input.psi
        pti:
          from: input.pti
        requestType:
          from: input.request-type
        ingressRef:
          from: input.ingress-ref
        lifecycleRef:
          from: input.lifecycle-ref
        currentSessionInstanceRef:
          from: read-initial-resources.output.currentSessionInstanceRef
        freshnessSeconds:
          value: 5
        absencePolicy:
          value: RETURN
      'on':
        SUCCEEDED: read-n4-forwarding
        UNRESOLVED: finalize-unresolved

    read-n4-forwarding:
      call: createdsession-tools::ca.session.n4.forwarding.read
      with:
        ueRef:
          from: input.ue-ref
        pduSessionId:
          from: input.psi
        pti:
          from: input.pti
        requestType:
          from: input.request-type
        ingressRef:
          from: input.ingress-ref
        lifecycleRef:
          from: input.lifecycle-ref
        currentSessionInstanceRef:
          from: read-initial-resources.output.currentSessionInstanceRef
      postconditions:
        steps:
          - verify: createdsession.n4.forwarding_ready
            with:
              resources:
                from: read-n4-forwarding.output
        'on':
          PASS: finalize-success
          FAIL: finalize-failed
          UNKNOWN: finalize-unresolved
      'on':
        FAILED: finalize-unresolved
        DENIED: finalize-failed
        UNKNOWN: finalize-unresolved

    # Success is decided by the two core-network facts already verified above:
    # the SMF adopted the RAN resources and the SMF/UPF downlink forwarding
    # resources match the same N4 session instance. UE-internal state (NAS
    # PS-ACTIVE, TUN, ping) is not an Agent-observable business fact and is not
    # a completion gate.
    finalize-success:
      procedure: finalize-resource-responsibility
      with:
        ue-ref:
          from: input.ue-ref
        lifecycle-ref:
          from: input.lifecycle-ref
        disposition:
          value: success
      'on':
        SUCCEEDED: done
        FAILED: safe-stopped
        UNRESOLVED: unresolved
        SAFE_STOPPED: safe-stopped

    finalize-failed:
      procedure: finalize-resource-responsibility
      with:
        ue-ref:
          from: input.ue-ref
        lifecycle-ref:
          from: input.lifecycle-ref
        disposition:
          value: failed
      'on':
        SUCCEEDED: failed
        FAILED: safe-stopped
        UNRESOLVED: unresolved
        SAFE_STOPPED: safe-stopped

    finalize-unresolved:
      procedure: finalize-resource-responsibility
      with:
        ue-ref:
          from: input.ue-ref
        lifecycle-ref:
          from: input.lifecycle-ref
        disposition:
          value: unresolved
      'on':
        SUCCEEDED: unresolved
        FAILED: safe-stopped
        UNRESOLVED: unresolved
        SAFE_STOPPED: safe-stopped

    reconcile-nudm-sdm-subscribe:
      reconcile: nudm-sdm-subscribe
      'on':
        COMMITTED: safe-stopped
        NOT_COMMITTED: safe-stopped
        UNRESOLVED: safe-stopped

    reconcile-npcf-sm-policy-control-create:
      reconcile: npcf-sm-policy-control-create
      'on':
        COMMITTED: safe-stopped
        NOT_COMMITTED: safe-stopped
        UNRESOLVED: safe-stopped

    reconcile-n1n2-message-transfer:
      reconcile: namf-communication-n1n2-message-transfer
      'on':
        COMMITTED: safe-stopped
        NOT_COMMITTED: safe-stopped
        UNRESOLVED: safe-stopped

    done:
      terminal: SUCCEEDED
    failed:
      terminal: FAILED
    unresolved:
      terminal: UNRESOLVED
    safe-stopped:
      terminal: SAFE_STOPPED

finalize-resource-responsibility:
  inputs:
    ue-ref: {}
    lifecycle-ref: {}
    disposition: {}
  start: transfer
  nodes:
    transfer:
      call: createdsession-tools::ca.session.resource_responsibility.transfer
      with:
        lifecycleRef:
          from: input.lifecycle-ref
        disposition:
          from: input.disposition
      'on':
        SUCCEEDED: read-resource-responsibility
        NOT_COMMITTED: safe-stopped
        OUTCOME_UNKNOWN: reconcile-transfer
        FAILED: safe-stopped
        DENIED: safe-stopped
        UNKNOWN: unresolved

    read-resource-responsibility:
      call: ca-agent-host::ca.session.resource_responsibility.read
      with:
        ueRef:
          from: input.ue-ref
        lifecycleRef:
          from: input.lifecycle-ref
      postconditions:
        steps:
          - verify: createdsession.resources.managed
            with:
              responsibility:
                from: read-resource-responsibility.output
        'on':
          PASS: done
          FAIL: safe-stopped
          UNKNOWN: unresolved
      'on':
        FAILED: unresolved
        DENIED: safe-stopped
        UNKNOWN: unresolved

    reconcile-transfer:
      reconcile: transfer
      'on':
        COMMITTED: safe-stopped
        NOT_COMMITTED: safe-stopped
        UNRESOLVED: safe-stopped

    done:
      terminal: SUCCEEDED
    unresolved:
      terminal: UNRESOLVED
    safe-stopped:
      terminal: SAFE_STOPPED
