apiVersion: connectionagent.io/vnext
kind: SkillContract
metadata:
  name: establish-pdu-session
spec:
  skillType: executable
  goal: pdu_session.initial_request_fulfilled
  entryProcedure: ue-requested-pdu-session-establishment
  inputs:
    requestSchema: schemas/establishment-request.schema.yaml
  context:
    requiredFacts:
    - createdsession_ingress
    - createdsession_lifecycle
    schemas:
      subject: urn:connectionagent:5gc:skill-context:subject:v1
      facts: urn:connectionagent:5gc:skill-context:facts:v1
      ingress: urn:connectionagent:5gc:skill-context:ingress:v1
      evidence: urn:connectionagent:host:predicate-evidence-refs:v1
  allowedResources:
    capabilities:
    - deployment-capabilities::provider-5gc.createdsession.udm
    - deployment-capabilities::provider-5gc.createdsession.pcf
    - deployment-capabilities::provider-5gc.createdsession.context
    - deployment-capabilities::env-fabric.createdsession.hold
    - deployment-capabilities::ca-provider-5gc.createdsession.transfer
    - deployment-capabilities::ca-agent-host.createdsession.runtime
    - deployment-capabilities::provider-5gc.createdsession.assurance
    - deployment-capabilities::env-fabric.createdsession.governance
  postconditions:
  - predicate: createdsession.ran.setup_accepted
    expect: PASS
  - predicate: createdsession.n4.forwarding_ready
    expect: PASS
  - predicate: createdsession.resources.managed
    expect: PASS
  planning:
    maxActions: 32
    allowDynamicProcedure: false
  failureSemantics:
    outcomeUnknown:
      requireReconcile: true
