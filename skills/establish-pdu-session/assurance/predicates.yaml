createdsession.udm.hold_bound:
  inputs: [hold, dnn, sst]
  evaluator:
    type: cel
    expression: >-
      hold.operationKind == "UDM_SDM_SUBSCRIPTION_CREATE" &&
      hold.holdRef != "" &&
      hold.currentInstanceRef != "" &&
      hold.heldRequestDigest != "" &&
      hold.dnn == dnn &&
      hold.sst == sst

createdsession.pcf.hold_bound:
  inputs: [hold]
  evaluator:
    type: cel
    expression: >-
      hold.operationKind == "PCF_SM_POLICY_CREATE" &&
      hold.holdRef != "" &&
      hold.currentInstanceRef == hold.policyAssociationRef &&
      hold.heldRequestDigest != "" &&
      hold.policyAssociationRef != ""

createdsession.pcf.create_inputs.ready:
  inputs: [pcfCreateInputs, pcfHold]
  evaluator:
    type: cel
    expression: >-
      pcfCreateInputs.pcfCreateInputsRef != "" &&
      pcfCreateInputs.pcfPolicyAssociationRef == pcfHold.policyAssociationRef &&
      pcfCreateInputs.fabricHoldRef == pcfHold.holdRef &&
      pcfCreateInputs.allocatedIPv4 != "" &&
      pcfCreateInputs.selectionDigest != ""

createdsession.pcf.create_governed:
  inputs: [governance]
  evaluator:
    type: cel
    expression: >-
      governance.lifecycleIsolationState == "CLEAN" &&
      governance.lifecycleIsolationEvidenceRef != "" &&
      governance.competingCreateState == "NOT_FORWARDED" &&
      governance.competingCreateGovernanceRef != "" &&
      governance.agentAuthorized == true

createdsession.udm.subscription_owned:
  inputs: [subscription]
  evaluator:
    type: cel
    expression: >-
      subscription.creationState == "CREATED" &&
      subscription.ownership == "AGENT" &&
      subscription.managementState == "DURABLE" &&
      subscription.subscriptionRef != ""

createdsession.pcf.association_owned:
  inputs: [association]
  evaluator:
    type: cel
    expression: >-
      association.creationState == "CREATED" &&
      association.ownership == "AGENT" &&
      association.managementState == "DURABLE" &&
      association.policyResultRef != ""

createdsession.n4.baseline_clear:
  inputs: [baseline]
  evaluator:
    type: cel
    expression: >-
      baseline.phase == "PRE_CREATE" &&
      baseline.pairState == "NO_N4_PAIR" &&
      baseline.baselineRef != ""

createdsession.n4.initial_resources_ready:
  inputs: [resources]
  evaluator:
    type: cel
    expression: >-
      resources.phase == "POST_CREATE" &&
      resources.pairState == "NEW_PAIR" &&
      resources.bindingStatus == "CURRENT" &&
      resources.defaultFlowInstalled == true &&
      resources.uplinkEndpointBound == true &&
      resources.baselineEvidenceRef != "" &&
      resources.currentSessionInstanceRef != ""

createdsession.n1n2.hold_bound:
  inputs: [hold]
  evaluator:
    type: cel
    expression: >-
      hold.operationKind == "N1N2_MESSAGE_TRANSFER" &&
      hold.holdRef != "" &&
      hold.currentInstanceRef != "" &&
      hold.heldRequestDigest != "" &&
      hold.targetNfInstanceId != "" &&
      hold.supi != "" &&
      hold.deadline != ""

createdsession.delivery_context.ready:
  inputs: [context]
  evaluator:
    type: cel
    expression: >-
      context.bindingStatus == "CURRENT" &&
      context.addressAllocated == true &&
      context.nasInputsComplete == true &&
      context.delegatedCallerAuthorized == true &&
      context.uniqueSenderReserved == false

createdsession.amf.transfer_initiated:
  inputs: [transferResult, expectedOperationRef]
  evaluator:
    type: script
    ref: scripts/evaluate_transfer_start.py

createdsession.ran.setup_accepted:
  inputs: [setup]
  evaluator:
    type: cel
    expression: >-
      setup.result == "ACCEPTED" &&
      setup.requiredFlowMatched == true &&
      setup.currentInstanceBound == true &&
      setup.baselineRanEndpointPresent == false

createdsession.n4.forwarding_ready:
  inputs: [resources]
  evaluator:
    type: cel
    expression: >-
      resources.bindingStatus == "CURRENT" &&
      resources.requiredFlowMatched == true &&
      resources.downlinkTunnelMatched == true &&
      resources.gatesAllowForwarding == true &&
      resources.exactPairMatchCount == 1

createdsession.resources.managed:
  inputs: [responsibility]
  evaluator:
    type: cel
    expression: >-
      responsibility.managementState == "ACCEPTED" &&
      responsibility.allResourcesCovered == true &&
      responsibility.pendingResponsibilitiesRetained == true

createdsession.udm.subscription_usable:
  inputs: [udmReadResult]
  evaluator:
    type: script
    ref: scripts/evaluate_udm_read.py

createdsession.lifecycle.ready:
  inputs: [lifecycle, expectedLifecycleRef]
  evaluator:
    type: cel
    expression: >-
      lifecycle.lifecycleRef == expectedLifecycleRef &&
      lifecycle.registrationState == "DURABLE" &&
      lifecycle.receiverState == "READY" &&
      lifecycle.lateResultResponsibility == "RETAINED"
