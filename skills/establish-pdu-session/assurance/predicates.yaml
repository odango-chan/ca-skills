apiVersion: connectionagent.io/v1alpha2
kind: PredicateSet
metadata:
  skill: establish-pdu-session
predicates:
  createdsession.ingress.eligible:
    inputs:
      ingress: {}
      requestType: {}
      pti: {}
    evaluator:
      type: cel
      expression: input.ingress.requestType == input.requestType && input.ingress.pti == input.pti &&
        input.ingress.messageType == 193 && input.ingress.bindingStatus == "CURRENT" &&
        input.ingress.actionAuthorized == true

  createdsession.udm.hold_bound:
    inputs:
      hold: {}
      dnn: {}
      sst: {}
    evaluator:
      type: cel
      expression: input.hold.bindingStatus == "CURRENT" &&
        input.hold.operationKind == "UDM_SDM_SUBSCRIPTION_CREATE" && input.hold.holdRef != "" &&
        input.hold.currentInstanceRef != "" && input.hold.heldRequestDigest != "" &&
        input.hold.dnn == input.dnn && input.hold.sst == input.sst

  createdsession.pcf.hold_bound:
    inputs:
      hold: {}
    evaluator:
      type: cel
      expression: input.hold.bindingStatus == "CURRENT" &&
        input.hold.operationKind == "PCF_SM_POLICY_CREATE" && input.hold.holdRef != "" &&
        input.hold.currentInstanceRef == input.hold.policyAssociationRef &&
        input.hold.heldRequestDigest != "" && input.hold.policyAssociationRef != ""

  createdsession.pcf.create_inputs.ready:
    inputs:
      pcfCreateInputs: {}
      pcfHold: {}
    evaluator:
      type: cel
      expression: input.pcfCreateInputs.bindingStatus == "CURRENT" &&
        input.pcfCreateInputs.pcfCreateInputsRef != "" &&
        input.pcfCreateInputs.pcfPolicyAssociationRef == input.pcfHold.policyAssociationRef &&
        input.pcfCreateInputs.fabricHoldRef == input.pcfHold.holdRef &&
        input.pcfCreateInputs.allocatedIPv4 != "" && input.pcfCreateInputs.selectionDigest != ""

  createdsession.pcf.create_governed:
    inputs:
      governance: {}
    evaluator:
      type: cel
      expression: input.governance.lifecycleIsolationState == "CLEAN" &&
        input.governance.lifecycleIsolationEvidenceRef != "" &&
        input.governance.competingCreateState == "NOT_FORWARDED" &&
        input.governance.competingCreateGovernanceRef != "" && input.governance.agentAuthorized == true

  createdsession.udm.subscription_owned:
    inputs:
      subscription: {}
    evaluator:
      type: cel
      expression: input.subscription.creationState == "CREATED" &&
        input.subscription.ownership == "AGENT" &&
        input.subscription.managementState == "DURABLE" && input.subscription.subscriptionRef != ""

  createdsession.pcf.association_owned:
    inputs:
      association: {}
    evaluator:
      type: cel
      expression: input.association.creationState == "CREATED" &&
        input.association.ownership == "AGENT" &&
        input.association.managementState == "DURABLE" && input.association.policyResultRef != ""

  createdsession.n4.baseline_clear:
    inputs:
      n4Baseline: {}
    evaluator:
      type: cel
      expression: input.n4Baseline.phase == "PRE_CREATE" &&
        input.n4Baseline.pairState == "NO_N4_PAIR" && input.n4Baseline.baselineRef != ""

  createdsession.n4.initial_resources_ready:
    inputs:
      n4InitialResources: {}
    evaluator:
      type: cel
      expression: input.n4InitialResources.phase == "POST_CREATE" &&
        input.n4InitialResources.pairState == "NEW_PAIR" &&
        input.n4InitialResources.bindingStatus == "CURRENT" &&
        input.n4InitialResources.defaultFlowInstalled == true &&
        input.n4InitialResources.uplinkEndpointBound == true &&
        input.n4InitialResources.baselineEvidenceRef != "" &&
        input.n4InitialResources.currentSessionInstanceRef != ""

  createdsession.n1n2.hold_bound:
    inputs:
      hold: {}
    evaluator:
      type: cel
      expression: input.hold.bindingStatus == "CURRENT" &&
        input.hold.operationKind == "N1N2_MESSAGE_TRANSFER" && input.hold.holdRef != "" &&
        input.hold.currentInstanceRef != "" && input.hold.heldRequestDigest != "" &&
        input.hold.targetNfInstanceId != "" && input.hold.supi != "" && input.hold.deadline != ""

  createdsession.delivery_context.ready:
    inputs:
      deliveryContext: {}
    evaluator:
      type: cel
      expression: input.deliveryContext.bindingStatus == "CURRENT" &&
        input.deliveryContext.addressAllocated == true &&
        input.deliveryContext.nasInputsComplete == true &&
        input.deliveryContext.delegatedCallerAuthorized == true &&
        input.deliveryContext.uniqueSenderReserved == false

  createdsession.amf.transfer_initiated:
    inputs:
      transferResult: {}
    evaluator:
      type: script
      ref: scripts/evaluate_transfer_start.py

  createdsession.ran.setup_accepted:
    inputs:
      ranSetup: {}
    evaluator:
      type: cel
      expression: input.ranSetup.result == "ACCEPTED" &&
        input.ranSetup.requiredFlowMatched == true &&
        input.ranSetup.currentInstanceBound == true &&
        input.ranSetup.baselineRanEndpointPresent == false

  createdsession.n4.forwarding_ready:
    inputs:
      n4Forwarding: {}
    evaluator:
      type: cel
      expression: input.n4Forwarding.bindingStatus == "CURRENT" &&
        input.n4Forwarding.requiredFlowMatched == true &&
        input.n4Forwarding.downlinkTunnelMatched == true &&
        input.n4Forwarding.gatesAllowForwarding == true &&
        input.n4Forwarding.exactPairMatchCount == 1

  createdsession.resources.managed:
    inputs:
      resourceResponsibility: {}
    evaluator:
      type: cel
      expression: input.resourceResponsibility.managementState == "ACCEPTED" &&
        input.resourceResponsibility.allResourcesCovered == true &&
        input.resourceResponsibility.pendingResponsibilitiesRetained == true

  createdsession.udm.subscription_usable:
    inputs:
      udmReadResult: {}
    evaluator:
      type: script
      ref: scripts/evaluate_udm_read.py

  createdsession.lifecycle.ready:
    inputs:
      lifecycleRegistration: {}
      expectedLifecycleRef: {}
    evaluator:
      type: cel
      expression: input.lifecycleRegistration.lifecycleRef == input.expectedLifecycleRef &&
        input.lifecycleRegistration.registrationState == "DURABLE" &&
        input.lifecycleRegistration.receiverState == "READY" &&
        input.lifecycleRegistration.lateResultResponsibility == "RETAINED"
