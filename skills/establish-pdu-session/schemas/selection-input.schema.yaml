$schema: https://json-schema.org/draft/2020-12/schema
$id: selection-input.schema.yaml
title: EstablishmentSelectionInput
type: object
additionalProperties: false
required:
- dnn
- sNssai
- requestedPduSessionType
- requestedSscMode
- subscription
properties:
  dnn:
    type: string
    pattern: ^[a-z0-9][a-z0-9.-]*$
  sNssai:
    type: object
    additionalProperties: false
    required:
    - sst
    properties:
      sst:
        type: integer
        minimum: 0
        maximum: 255
      sd:
        type: integer
        minimum: 0
        maximum: 16777214
  requestedPduSessionType:
    type: string
    const: IPV4
  requestedSscMode:
    type: integer
    const: 1
  subscription:
    type: object
    required:
    - dnn
    - sNssai
    - pduSessionTypes
    - sscModes
    - sessionAmbr
    - defaultQos
    properties:
      dnn:
        type: string
        pattern: ^[a-z0-9][a-z0-9.-]*$
      sNssai:
        type: object
        additionalProperties: false
        required:
        - sst
        properties:
          sst:
            type: integer
            minimum: 0
            maximum: 255
          sd:
            type: integer
            minimum: 0
            maximum: 16777214
      pduSessionTypes:
        type: object
        anyOf:
        - required: [allowedSessionTypes]
        - required: [defaultSessionType]
        properties:
          allowedSessionTypes:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum: [IPV4, IPV6, IPV4V6]
          defaultSessionType:
            type: string
            enum: [IPV4, IPV6, IPV4V6]
        additionalProperties: true
      sscModes:
        type: object
        anyOf:
        - required: [allowedSscModes]
        - required: [defaultSscMode]
        properties:
          allowedSscModes:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: integer
              enum: [1, 2, 3]
          defaultSscMode:
            type: integer
            enum: [1, 2, 3]
        additionalProperties: true
      sessionAmbr:
        type: object
        additionalProperties: false
        required: [uplink, downlink]
        properties:
          uplink:
            type: string
            pattern: '^[0-9]+(\.[0-9]+)? (bps|Kbps|Mbps|Gbps|Tbps)$'
          downlink:
            type: string
            pattern: '^[0-9]+(\.[0-9]+)? (bps|Kbps|Mbps|Gbps|Tbps)$'
      defaultQos:
        type: object
        additionalProperties: false
        required: [fiveQi, arp]
        properties:
          fiveQi:
            type: integer
            minimum: 0
            maximum: 255
          arp:
            type: object
            additionalProperties: false
            required: [priorityLevel, preemptCap, preemptVuln]
            properties:
              priorityLevel:
                type: integer
                minimum: 1
                maximum: 15
              preemptCap:
                enum: [MAY_PREEMPT, NOT_PREEMPT]
              preemptVuln:
                enum: [PREEMPTABLE, NOT_PREEMPTABLE]
    additionalProperties: true
