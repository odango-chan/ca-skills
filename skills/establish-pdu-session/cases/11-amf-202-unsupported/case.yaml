apiVersion: connectionagent.io/v1alpha1
kind: SkillTestCase
metadata:
  skill: establish-pdu-session
  name: 11-amf-202-unsupported
spec:
  classes:
  - evidence_boundary
  purpose: An acknowledged asynchronous transfer outside the profile is not completion.
  context:
    apiVersion: connectionagent.io/v1alpha1
    kind: PlanningContext
    metadata:
      operationId: cs-candidate-01
      version: 1
    subject:
      ueRef: synthetic-ue-a
    request:
      pduSessionId: 1
      dnn: internet
      sNssai:
        sst: 1
        sd: 0
      servingPlmn:
        mcc: '001'
        mnc: '01'
      requestedPduSessionType: IPV4
      requestedSscMode: 1
    facts:
      createdsession_ingress:
        value:
          ref: synthetic-ingress-a
        authoritative: true
      createdsession_lifecycle:
        value:
          ref: synthetic-lifecycle-a
        authoritative: true
    availableResources:
    - ref: sbi.udm.sm_data.get
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: fivegc.session.operation_context.read
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: sbi.udm.sdm_subscription.create
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: sbi.pcf.sm_policy.create
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: sbi.amf.n1n2.transfer
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: createdsession.operation.reconcile
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: fivegc.session.resource_responsibility.transfer
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: skill.select-establishment-configuration
      kind: tool
      version: 1.0.0
      effect: local_compute
      invocable: true
    - ref: skill.evaluate-udm-read
      kind: tool
      version: 1.0.0
      effect: local_compute
      invocable: true
    - ref: fivegc.session.evidence.await
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: skill.evaluate-transfer-start
      kind: tool
      version: 1.0.0
      effect: local_compute
      invocable: true
    - ref: fivegc.session.establishment_response.prepare
      kind: capability
      version: v1
      effect: local_compute
      invocable: true
    constraints:
      maxActions: 32
  expect:
    procedure: establish-initial
    planningStatus: READY
    terminal: UNRESOLVED
    postconditions:
    - predicate: createdsession.ran.setup_accepted
      expect: PASS
      actual: NOT_EVALUATED
    - predicate: createdsession.n4.forwarding_ready
      expect: PASS
      actual: NOT_EVALUATED
    - predicate: createdsession.ue.configuration_accepted
      expect: PASS
      actual: NOT_EVALUATED
    - predicate: createdsession.resources.managed
      expect: PASS
      actual: PASS
  fixtures:
    actions:
      get-sm-data: SUCCEEDED
      select-configuration: SUCCEEDED
      inspect-policy-context: SUCCEEDED
      subscribe-udm: COMMITTED
      create-policy: COMMITTED
      inspect-delivery-context: SUCCEEDED
      transfer-to-amf: COMMITTED
      handoff-success: COMMITTED
      handoff-failed: COMMITTED
      handoff-unresolved: COMMITTED
      await-ran-result: SUCCEEDED
      await-forwarding: SUCCEEDED
      await-ue: SUCCEEDED
      prepare-establishment-response: SUCCEEDED
    predicates:
      verify-ingress:
        createdsession.ingress.eligible: PASS
      verify-udm:
        createdsession.udm.subscription_usable: PASS
      verify-policy-context:
        createdsession.policy_context.ready: PASS
      verify-subscription:
        createdsession.udm.subscription_owned: PASS
      verify-policy:
        createdsession.pcf.association_owned: PASS
      verify-initial-n4:
        createdsession.n4.initial_resources_ready: PASS
      verify-delivery-context:
        createdsession.delivery_context.ready: PASS
      verify-transfer:
        createdsession.amf.transfer_initiated: UNKNOWN
      verify-ran:
        createdsession.ran.setup_accepted: PASS
      verify-forwarding:
        createdsession.n4.forwarding_ready: PASS
      verify-ue:
        createdsession.ue.configuration_accepted: PASS
      verify-handoff-success:
        createdsession.resources.managed: PASS
      verify-handoff-failed:
        createdsession.resources.managed: PASS
      verify-handoff-unresolved:
        createdsession.resources.managed: PASS
