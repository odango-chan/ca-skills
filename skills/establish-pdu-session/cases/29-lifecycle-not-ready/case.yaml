      version: 1.0.0
      effect: local_compute
      invocable: true
    - ref: skill.evaluate-udm-read
      kind: tool
      version: 1.0.0
      effect: local_compute
      invocable: true
    - ref: ca.session.evidence.await
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: skill.evaluate-transfer-start
      kind: tool
      version: 1.0.0
      effect: local_compute
      invocable: true
    - ref: ca.session.establishment_response.prepare
      kind: capability
      version: v1
      effect: local_compute
      invocable: true
