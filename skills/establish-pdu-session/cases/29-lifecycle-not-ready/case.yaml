      pti: 7
      requestType: 1
      dnn: internet
      sNssai:
        sst: 1
        sd: 0
      servingPlmn:
        mcc: '001'
        mnc: '01'
      requestedPduSessionType: IPV4
      requestedSscMode: 1
    facts:
      createdsession_ingress:
        value: synthetic-ingress-a
        authoritative: true
      createdsession_lifecycle:
        value: synthetic-lifecycle-a
        authoritative: true
    availableResources:
    - ref: sbi.udm.sm_data.get
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: ca.session.operation_context.read
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: sbi.udm.sdm_subscription.create
