  purpose: 'Synthetic obligation: a known unready durable receiver blocks the first NF resource create.'
  context:
    apiVersion: connectionagent.io/v1alpha1
    kind: PlanningContext
    metadata:
      operationId: cs-candidate-29
      version: 1
    subject:
      ueRef: synthetic-ue-a
