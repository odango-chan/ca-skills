      match: exact
      ordered:
      - nodeId: observe-object
        outcome: SUCCEEDED
      - nodeId: verify-size-known
        outcome: PASS
      - nodeId: derive-requirement
        outcome: SUCCEEDED
      - nodeId: resolve-qos
        outcome: DENIED
  fixtures:
    actions:
      observe-object: SUCCEEDED
      derive-requirement: SUCCEEDED
      resolve-qos: DENIED
    predicates:
      verify-size-known:
        object.size.known: PASS
