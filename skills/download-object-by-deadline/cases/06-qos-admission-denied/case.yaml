apiVersion: connectionagent.io/v1alpha1
kind: SkillTestCase
metadata:
  skill: download-object-by-deadline
  name: 06-qos-admission-denied
spec:
  classes:
  - action_denied
  purpose: QoS 准入拒绝，Operation 以 ACTION_DENIED 失败。
  context:
    apiVersion: connectionagent.io/v1alpha1
    kind: PlanningContext
    metadata:
      operationId: dl-06
      version: 1
    subject:
      ueRef: imsi-001010000000001
    request:
      ueRef: imsi-001010000000001
      objectRef: obj-report-2026
      direction: downlink
      deadline: '2026-08-13T23:59:59Z'
    facts:
      ue.registered:
        value: PASS
      object.size.known:
        value: UNKNOWN
      bytes_remaining:
        value: 104857600
      seconds_remaining:
        value: 600
      minimum_payload_bitrate_bps:
        value: 1398102
    availableResources:
    - ref: object.metadata.query
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: user_plane.capacity.estimate
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: qos.requirement.resolve
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: pdu_session.create
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: pdu_session.modify_qos
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: pdu_session.query
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: pdu_session.reconcile
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: user_plane.probe
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: file.download
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: file.download.status
      kind: capability
      version: v1
      effect: read_only
      invocable: true
