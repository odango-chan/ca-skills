procedures:
  download-direct:
    inputs:
      objectref:
        type: string
        from: context.request.objectRef
      bytesremaining:
        type: integer
        from: context.request.sizeBytes
      secondsremaining:
        type: integer
        from: context.request.secondsRemaining
      ueref:
        type: string
        from: context.subject.ueRef
    start: derive-requirement
    nodes:
      derive-requirement:
        script: scripts/derive_transfer_requirement.py
        with:
          bytesRemaining:
            from: input.bytesremaining
          secondsRemaining:
            from: input.secondsremaining
        'on':
          SUCCEEDED: resolve-qos
          FAILED: failed
      resolve-qos:
        call: qos.requirement.resolve
        with:
          ueRef:
            from: input.ueref
          minimumPayloadBitrateBps:
            from: derive-requirement.output.minimumPayloadBitrateBps
        'on':
          SUCCEEDED: download-object
          FAILED: failed
          UNKNOWN: unresolved
          DENIED: failed
      download-object:
        call: file.download
        with:
          objectRef:
            from: input.objectref
          ueRef:
            from: input.ueref
          direction:
            value: downlink
        'on':
          COMMITTED: verify-transfer
          NOT_COMMITTED: failed
          OUTCOME_UNKNOWN: reconcile-download
          FAILED: failed
          DENIED: failed
      reconcile-download:
        call: file.download.status
        with:
          objectRef:
            from: input.objectref
          ueRef:
            from: input.ueref
        'on':
          COMMITTED: verify-transfer
          NOT_COMMITTED: download-object
          UNRESOLVED: unresolved
          FAILED: safe-stopped
          DENIED: safe-stopped
      verify-transfer:
        verify: file_transfer.completed
        'on':
          PASS: verify-transfer-2
          FAIL: failed
          UNKNOWN: unresolved
      verify-transfer-2:
        verify: file_transfer.deadline_met
        'on':
          PASS: done
          FAIL: failed
          UNKNOWN: unresolved
      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
      unresolved:
        terminal: UNRESOLVED
      safe-stopped:
        terminal: SAFE_STOPPED
    applicability:
      when: has(request.sizeBytes) && request.sizeBytes > 0

  observe-then-download:
    inputs:
      objectref:
        type: string
        from: context.request.objectRef
      secondsremaining:
        type: integer
        from: context.request.secondsRemaining
      ueref:
        type: string
        from: context.subject.ueRef
    start: observe-object
    nodes:
      observe-object:
        call: object.metadata.query
        with:
          objectRef:
            from: input.objectref
        'on':
          SUCCEEDED: verify-size-known
          FAILED: size-unobservable
          UNKNOWN: size-unobservable
          DENIED: size-unobservable
      verify-size-known:
        verify: object.size.known
        'on':
          PASS: derive-requirement
          FAIL: size-unobservable
          UNKNOWN: size-unobservable
      derive-requirement:
        script: scripts/derive_transfer_requirement.py
        with:
          bytesRemaining:
            from: observe-object.output.sizeBytes
          secondsRemaining:
            from: input.secondsremaining
        'on':
          SUCCEEDED: resolve-qos
          FAILED: failed
      resolve-qos:
        call: qos.requirement.resolve
        with:
          ueRef:
            from: input.ueref
          minimumPayloadBitrateBps:
            from: derive-requirement.output.minimumPayloadBitrateBps
        'on':
          SUCCEEDED: download-object
          FAILED: failed
          UNKNOWN: unresolved
          DENIED: failed
      download-object:
        call: file.download
        with:
          objectRef:
            from: input.objectref
          ueRef:
            from: input.ueref
          direction:
            value: downlink
        'on':
          COMMITTED: verify-transfer
          NOT_COMMITTED: failed
          OUTCOME_UNKNOWN: reconcile-download
          FAILED: failed
          DENIED: failed
      reconcile-download:
        call: file.download.status
        with:
          objectRef:
            from: input.objectref
          ueRef:
            from: input.ueref
        'on':
          COMMITTED: verify-transfer
          NOT_COMMITTED: download-object
          UNRESOLVED: unresolved
          FAILED: safe-stopped
          DENIED: safe-stopped
      verify-transfer:
        verify: file_transfer.completed
        'on':
          PASS: verify-transfer-2
          FAIL: failed
          UNKNOWN: unresolved
      verify-transfer-2:
        verify: file_transfer.deadline_met
        'on':
          PASS: done
          FAIL: failed
          UNKNOWN: unresolved
      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
      unresolved:
        terminal: UNRESOLVED
      safe-stopped:
        terminal: SAFE_STOPPED
      size-unobservable:
        terminal: PLANNING_BLOCKED
    applicability:
      when: "!has(request.sizeBytes) || request.sizeBytes <= 0"
