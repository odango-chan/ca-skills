$schema: https://json-schema.org/draft/2020-12/schema
$id: download-request.schema.yaml
title: DownloadRequest
type: object
required: [ueRef, objectRef, direction, deadline, secondsRemaining]
properties:
  ueRef:
    type: string
    minLength: 1
  objectRef:
    type: string
    minLength: 1
  direction:
    const: downlink
  deadline:
    type: string
    pattern: '^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\.[0-9]+)?Z$'
  secondsRemaining:
    type: integer
    minimum: 1
  sizeBytes:
    type: integer
    minimum: 1
additionalProperties: false
