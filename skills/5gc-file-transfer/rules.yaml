uses:
  - context.runtime_state.no_fabrication

rules:
  urgency.explicit_only:
    subject: MODEL_PROPOSAL
    policy:
      shortDeadlineMax: 5m
    statement: >
      urgency 只能来自用户意图中的明确加速语义，或满足冻结 short-deadline policy
      的明确 deadline；文件大小本身不能推出 urgent。
    violation: PARAMETER_FABRICATION

  governed_entrypoint_only:
    subject: MODEL_PROPOSAL
    statement: >
      请求完成规范化后必须交给受治理的 assurance entrypoint；模型不得自行拼装底层 Tool 调用序列绕过治理边界。
    violation: RAW_TOOL_BYPASS
