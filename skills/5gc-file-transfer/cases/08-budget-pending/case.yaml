apiVersion: connectionagent.io/v1alpha1
kind: SkillTestCase
metadata:
  skill: 5gc-file-transfer
  name: 08-budget-pending
spec:
  classes:
  - budget_exhausted_with_pending_write
  purpose: 创建结果未知且预算耗尽时保留待决写并安全停止；预算耗尽是并存事实，不覆盖 UNKNOWN 的直接原因。
  context:
    apiVersion: connectionagent.io/v1alpha1
    kind: PlanningContext
    metadata:
      operationId: op-08-budget-pending
      version: 1
    subject:
      senderId: '001019876543210'
    request:
      operation: prepare_transfer
      transferId: tr-source-001
      urgency: normal
      senderImsi: '001019876543210'
      receiverImsis:
      - '001019876543211'
    facts:
      virtual_group.id:
        value: vg-20260907-001
    availableResources:
    - ref: transfer.participants.resolve_endpoints
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: edge.cache.ensure
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: edge.cache.reconcile
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: virtual_group.create
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: virtual_group.reconcile_create
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: virtual_group.assign_members
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: virtual_group.reconcile_members
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: transfer.qos.boost
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: transfer.qos.reconcile
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: virtual_group.release
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: virtual_group.reconcile_release
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    constraints:
      maxActions: 3
  expect:
    procedure: prepare-file-transfer-normal
    planningStatus: READY
    terminal: SAFE_STOPPED
    postconditions:
    - predicate: file_transfer.request.satisfied
      expect: PASS
      actual: NOT_EVALUATED
    # Runtime owner contract (ca-runtime docs/design/provider-boundary.md
    # §14-§16, ca-runtime#96 CLOSED): when a mutation result is OUTCOME_UNKNOWN
    # and action budget is exhausted, Runtime terminal = SAFE_STOPPED with the
    # mutation retained as pendingAction and reasonCode empty. Budget exhaustion
    # is a coexisting fact and must not overwrite UNKNOWN; the admitted recovery
    # retry, if any, must not dispatch when budget is exhausted
    # (reasonCode BUDGET_EXHAUSTED_PENDING_RETRY).
  fixtures:
    actions:
      resolve-member-endpoints: SUCCEEDED
      ensure-edge-cache: COMMITTED
      create-vg: OUTCOME_UNKNOWN
    predicates:
      verify-registration:
        transfer.participants.registered: PASS
      verify-sessions:
        transfer.participants.pdu_sessions_active: PASS
