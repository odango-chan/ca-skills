      receiver-imsis:
        type: array
        maxItems: 16
        from: context.request.receiverImsis
      sender-imsi:
        type: string
        from: context.request.senderImsi
      transfer-id:
        type: string
        from: context.request.transferId
      policy-dnn:
        type: string
        from: context.request.networkPolicy.dnn
      policy-sst:
        type: integer
        from: context.request.networkPolicy.sst
      policy-sd:
        type: string
        from: context.request.networkPolicy.sd
      policy-pdu-session-id:
        type: integer
        from: context.request.networkPolicy.pduSessionId
      policy-five-qi:
        type: integer
        from: context.request.networkPolicy.fiveQi

  release-virtual-group:
    applicability:
      when: request.operation == "release_group"
    start: release-vg
    nodes:
      release-vg:
        call: virtual_group.release
        with:
          transferId:
            from: input.transfer-id
          groupId:
            from: input.group-id
        'on':
          COMMITTED: verify-goal
          NOT_COMMITTED: failed
          OUTCOME_UNKNOWN: reconcile-release
          FAILED: failed
          DENIED: failed
      reconcile-release:
        call: virtual_group.reconcile_release
        with:
          transferId:
            from: input.transfer-id
          groupId:
            from: input.group-id
        'on':
          COMMITTED: verify-goal
          NOT_COMMITTED: safe-stopped
          UNRESOLVED: unresolved
          FAILED: safe-stopped
          DENIED: safe-stopped
      verify-goal:
        verify: file_transfer.request.satisfied
        'on':
          PASS: done
          FAIL: failed
          UNKNOWN: unresolved
      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
