procedures:
  # Normal prepare path. Registration is a UE-initiated external prerequisite
  # enforced by applicability; this procedure never invokes registration. Receiver
  # session/QoS prerequisites are composed before transfer-specific work.
  prepare-file-transfer-normal:
    applicability:
      predicates:
        ue.registered: PASS
      when: 'request.operation == "prepare_transfer" && request.urgency == "normal"'
    start: converge-receiver-sessions
    nodes:
      converge-receiver-sessions:
        for:
          each: receiver
          in:
            from: input.receiver-imsis
        do:
          converge-session-qos:
            procedure:
              skill: ensure-session-qos
              procedure: observe-session-then-converge
            with:
              supi:
                from: loop.receiver
              pdusessionid:
                from: input.policy-pdu-session-id
              dnn:
                from: input.policy-dnn
              sst:
                from: input.policy-sst
              sd:
                from: input.policy-sd
              fiveqi:
                from: input.policy-five-qi
        'on':
          SUCCEEDED: resolve-member-endpoints
          FAILED: failed
          UNRESOLVED: unresolved
          SAFE_STOPPED: safe-stopped
      resolve-member-endpoints:
        call: transfer.participants.resolve_endpoints
        with:
          senderImsi:
            from: input.sender-imsi
          receiverImsis:
            from: input.receiver-imsis
        'on':
          SUCCEEDED: ensure-edge-cache
          FAILED: failed
          UNKNOWN: unresolved
          DENIED: failed
      ensure-edge-cache:
        call: edge.cache.ensure
        with:
          transferId:
            from: input.transfer-id
        'on':
          COMMITTED: create-vg
          NOT_COMMITTED: failed
          OUTCOME_UNKNOWN: reconcile-edge-cache
          FAILED: failed
          DENIED: failed
      reconcile-edge-cache:
        call: edge.cache.reconcile
        with:
          transferId:
            from: input.transfer-id
        'on':
          COMMITTED: create-vg
          NOT_COMMITTED: ensure-edge-cache
          UNRESOLVED: unresolved
          FAILED: safe-stopped
          DENIED: safe-stopped
      create-vg:
        call: virtual_group.create
        with:
          transferId:
            from: input.transfer-id
          senderImsi:
            from: input.sender-imsi
          receiverImsis:
            from: input.receiver-imsis
          durationSeconds:
            value: 3600
          fiveQi:
            from: input.policy-five-qi
        'on':
          COMMITTED: assign-members
          NOT_COMMITTED: failed
          OUTCOME_UNKNOWN: reconcile-vg-create
          FAILED: failed
          DENIED: failed
      reconcile-vg-create:
        call: virtual_group.reconcile_create
        with:
          transferId:
            from: input.transfer-id
        'on':
          COMMITTED: assign-members
          NOT_COMMITTED: create-vg
          UNRESOLVED: unresolved
          FAILED: safe-stopped
          DENIED: safe-stopped
      # create-vg and reconcile-vg-create can each COMMIT the same virtual group;
      # whichever node produced it, the committed resource id is what the
      # downstream assign/reconcile members actions need. Both lineages converge
      # on one node bound from the owning mutation's output (no context.facts
      # intermediary). Note: the recover-only lineage relies on the owning node's
      # output, because a reconciled (collapsed) mutation output is not yet
      # exposable to downstream bindings; that Runtime contract gap is tracked
      # separately (Provider result-loss).
      assign-members:
        call: virtual_group.assign_members
        with:
          transferId:
            from: input.transfer-id
          groupId:
            from: create-vg.output.groupId
          members:
            from: resolve-member-endpoints.output.members
        'on':
          COMMITTED: verify-goal
          NOT_COMMITTED: failed
          OUTCOME_UNKNOWN: reconcile-vg-members
          FAILED: failed
          DENIED: failed
      reconcile-vg-members:
        call: virtual_group.reconcile_members
        with:
          transferId:
            from: input.transfer-id
          groupId:
            from: create-vg.output.groupId
          members:
            from: resolve-member-endpoints.output.members
        'on':
          COMMITTED: verify-goal
          NOT_COMMITTED: assign-members
          UNRESOLVED: unresolved
          FAILED: safe-stopped
          DENIED: safe-stopped
      verify-goal:
        verify: file_transfer.request.satisfied
        'on':
          PASS: done
          FAIL: failed
          UNKNOWN: unresolved
      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
      unresolved:
        terminal: UNRESOLVED
      safe-stopped:
        terminal: SAFE_STOPPED
    inputs:
      receiver-imsis:
        type: array
        maxItems: 16
        from: context.request.receiverImsis
      sender-imsi:
        type: string
        from: context.request.senderImsi
      transfer-id:
        type: string
        from: context.request.transferId
      policy-dnn:
        type: string
        from: context.request.networkPolicy.dnn
      policy-sst:
        type: integer
        from: context.request.networkPolicy.sst
      policy-sd:
        type: string
        from: context.request.networkPolicy.sd
      policy-pdu-session-id:
        type: integer
        from: context.request.networkPolicy.pduSessionId
      policy-five-qi:
        type: integer
        from: context.request.networkPolicy.fiveQi

  # Urgent prepare has the same registration applicability and receiver
  # session/QoS prerequisites as normal prepare, then adds the bounded urgent
  # QoS boost. Baseline QoS and urgent acceleration remain separate.
  prepare-file-transfer-urgent:
    applicability:
      predicates:
        ue.registered: PASS
      when: 'request.operation == "prepare_transfer" && request.urgency == "urgent"'
    start: converge-receiver-sessions
