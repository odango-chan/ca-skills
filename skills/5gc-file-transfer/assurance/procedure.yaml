apiVersion: connectionagent.io/v1alpha1
kind: ProcedureSet
metadata:
  skill: core5g-file-transfer
spec:
  selectionPolicy: exactlyOne
  procedures:
  - name: prepare-file-transfer-normal
    goal: file_transfer.orchestrate
    entry: verify-registration
    applicability:
      when: >
        request.operation == "prepare_transfer" &&
        request.urgency == "normal"
    nodes:
    - id: verify-registration
      type: verify
      predicates:
      - transfer.participants.registered
      'on':
        PASS: {next: verify-sessions}
        FAIL: {next: failed}
        UNKNOWN: {next: unresolved}
    - id: verify-sessions
      type: verify
      predicates:
      - transfer.participants.pdu_sessions_active
      'on':
        PASS: {next: ensure-edge-cache}
        FAIL: {next: failed}
        UNKNOWN: {next: unresolved}
    - id: ensure-edge-cache
      type: action
      ref: edge.cache.ensure
      inputs:
        upfId: {fromContext: request.upfId}
      'on':
        COMMITTED: {next: create-vg}
        NOT_COMMITTED: {next: failed}
        OUTCOME_UNKNOWN: {next: reconcile-edge-cache}
        FAILED: {next: failed}
        DENIED: {next: failed}
    - id: reconcile-edge-cache
      type: action
      ref: edge.cache.reconcile
      inputs:
        upfId: {fromContext: request.upfId}
        transferId: {fromContext: request.transferId}
      'on':
        COMMITTED: {next: create-vg}
        NOT_COMMITTED: {next: ensure-edge-cache}
        UNRESOLVED: {next: unresolved}
        FAILED: {next: safe-stopped}
        DENIED: {next: safe-stopped}
    - id: create-vg
      type: action
      ref: virtual_group.create
      inputs:
        transferId: {fromContext: request.transferId}
        senderImsi: {fromContext: request.senderImsi}
        receiverImsis: {fromContext: request.receiverImsis}
        durationSeconds: {fromContext: request.durationSeconds}
        fiveQi: {fromContext: request.fiveQi}
      'on':
        COMMITTED: {next: assign-members}
        NOT_COMMITTED: {next: failed}
        OUTCOME_UNKNOWN: {next: reconcile-vg-create}
        FAILED: {next: failed}
        DENIED: {next: failed}
    - id: reconcile-vg-create
      type: action
      ref: virtual_group.reconcile_create
      inputs:
        transferId: {fromContext: request.transferId}
      'on':
        COMMITTED: {next: assign-members}
        NOT_COMMITTED: {next: create-vg}
        UNRESOLVED: {next: unresolved}
        FAILED: {next: safe-stopped}
        DENIED: {next: safe-stopped}
    - id: assign-members
      type: action
      ref: virtual_group.assign_members
      inputs:
        transferId: {fromContext: request.transferId}
        groupId: {fromContext: facts.virtual_group.id}
        members: {fromContext: request.members}
      'on':
        COMMITTED: {next: verify-goal}
        NOT_COMMITTED: {next: failed}
        OUTCOME_UNKNOWN: {next: reconcile-vg-members}
        FAILED: {next: failed}
        DENIED: {next: failed}
    - id: reconcile-vg-members
      type: action
      ref: virtual_group.reconcile_members
      inputs:
        transferId: {fromContext: request.transferId}
        groupId: {fromContext: facts.virtual_group.id}
        members: {fromContext: request.members}
      'on':
        COMMITTED: {next: verify-goal}
        NOT_COMMITTED: {next: assign-members}
        UNRESOLVED: {next: unresolved}
        FAILED: {next: safe-stopped}
        DENIED: {next: safe-stopped}
    - id: verify-goal
      type: verify
      predicates:
      - file_transfer.request.satisfied
      'on':
        PASS: {next: done}
        FAIL: {next: failed}
        UNKNOWN: {next: unresolved}
    - id: done
      type: terminal
      result: SUCCEEDED
    - id: failed
      type: terminal
      result: FAILED
    - id: unresolved
      type: terminal
      result: UNRESOLVED
    - id: safe-stopped
      type: terminal
      result: SAFE_STOPPED

  - name: prepare-file-transfer-urgent
    goal: file_transfer.orchestrate
    entry: verify-registration
    applicability:
      when: >
        request.operation == "prepare_transfer" &&
        request.urgency == "urgent"
    nodes:
    - id: verify-registration
      type: verify
      predicates:
      - transfer.participants.registered
      'on':
        PASS: {next: verify-sessions}
        FAIL: {next: failed}
        UNKNOWN: {next: unresolved}
    - id: verify-sessions
      type: verify
      predicates:
      - transfer.participants.pdu_sessions_active
      'on':
        PASS: {next: ensure-edge-cache}
        FAIL: {next: failed}
        UNKNOWN: {next: unresolved}
    - id: ensure-edge-cache
      type: action
      ref: edge.cache.ensure
      inputs:
        upfId: {fromContext: request.upfId}
      'on':
        COMMITTED: {next: create-vg}
        NOT_COMMITTED: {next: failed}
        OUTCOME_UNKNOWN: {next: reconcile-edge-cache}
        FAILED: {next: failed}
        DENIED: {next: failed}
    - id: reconcile-edge-cache
      type: action
      ref: edge.cache.reconcile
      inputs:
        upfId: {fromContext: request.upfId}
        transferId: {fromContext: request.transferId}
      'on':
        COMMITTED: {next: create-vg}
        NOT_COMMITTED: {next: ensure-edge-cache}
        UNRESOLVED: {next: unresolved}
        FAILED: {next: safe-stopped}
        DENIED: {next: safe-stopped}
    - id: create-vg
      type: action
      ref: virtual_group.create
      inputs:
        transferId: {fromContext: request.transferId}
        senderImsi: {fromContext: request.senderImsi}
        receiverImsis: {fromContext: request.receiverImsis}
        durationSeconds: {fromContext: request.durationSeconds}
        fiveQi: {fromContext: request.fiveQi}
      'on':
        COMMITTED: {next: assign-members}
        NOT_COMMITTED: {next: failed}
        OUTCOME_UNKNOWN: {next: reconcile-vg-create}
        FAILED: {next: failed}
        DENIED: {next: failed}
    - id: reconcile-vg-create
      type: action
      ref: virtual_group.reconcile_create
      inputs:
        transferId: {fromContext: request.transferId}
      'on':
        COMMITTED: {next: assign-members}
        NOT_COMMITTED: {next: create-vg}
        UNRESOLVED: {next: unresolved}
        FAILED: {next: safe-stopped}
        DENIED: {next: safe-stopped}
    - id: assign-members
      type: action
      ref: virtual_group.assign_members
      inputs:
        transferId: {fromContext: request.transferId}
        groupId: {fromContext: facts.virtual_group.id}
        members: {fromContext: request.members}
      'on':
        COMMITTED: {next: qos-boost}
        NOT_COMMITTED: {next: failed}
        OUTCOME_UNKNOWN: {next: reconcile-vg-members}
        FAILED: {next: failed}
        DENIED: {next: failed}
    - id: reconcile-vg-members
      type: action
      ref: virtual_group.reconcile_members
      inputs:
        transferId: {fromContext: request.transferId}
        groupId: {fromContext: facts.virtual_group.id}
        members: {fromContext: request.members}
      'on':
        COMMITTED: {next: qos-boost}
        NOT_COMMITTED: {next: assign-members}
        UNRESOLVED: {next: unresolved}
        FAILED: {next: safe-stopped}
        DENIED: {next: safe-stopped}
    - id: qos-boost
      type: action
      ref: transfer.qos.boost
      inputs:
        transferId: {fromContext: request.transferId}
      'on':
        COMMITTED: {next: verify-goal}
        NOT_COMMITTED: {next: failed}
        OUTCOME_UNKNOWN: {next: reconcile-qos}
        FAILED: {next: failed}
        DENIED: {next: failed}
    - id: reconcile-qos
      type: action
      ref: transfer.qos.reconcile
      inputs:
        transferId: {fromContext: request.transferId}
      'on':
        COMMITTED: {next: verify-goal}
        NOT_COMMITTED: {next: failed}
        UNRESOLVED: {next: unresolved}
        FAILED: {next: safe-stopped}
        DENIED: {next: safe-stopped}
    - id: verify-goal
      type: verify
      predicates:
      - file_transfer.request.satisfied
      'on':
        PASS: {next: done}
        FAIL: {next: failed}
        UNKNOWN: {next: unresolved}
    - id: done
      type: terminal
      result: SUCCEEDED
    - id: failed
      type: terminal
      result: FAILED
    - id: unresolved
      type: terminal
      result: UNRESOLVED
    - id: safe-stopped
      type: terminal
      result: SAFE_STOPPED

  - name: release-virtual-group
    goal: file_transfer.orchestrate
    entry: release-vg
    applicability:
      when: request.operation == "release_group"
    nodes:
    - id: release-vg
      type: action
      ref: virtual_group.release
      inputs:
        transferId: {fromContext: request.transferId}
        groupId: {fromContext: request.groupId}
      'on':
        COMMITTED: {next: verify-goal}
        NOT_COMMITTED: {next: failed}
        OUTCOME_UNKNOWN: {next: reconcile-release}
        FAILED: {next: failed}
        DENIED: {next: failed}
    - id: reconcile-release
      type: action
      ref: virtual_group.reconcile_release
      inputs:
        transferId: {fromContext: request.transferId}
        groupId: {fromContext: request.groupId}
      'on':
        COMMITTED: {next: verify-goal}
        NOT_COMMITTED: {next: safe-stopped}
        UNRESOLVED: {next: unresolved}
        FAILED: {next: safe-stopped}
        DENIED: {next: safe-stopped}
    - id: verify-goal
      type: verify
      predicates:
      - file_transfer.request.satisfied
      'on':
        PASS: {next: done}
        FAIL: {next: failed}
        UNKNOWN: {next: unresolved}
    - id: done
      type: terminal
      result: SUCCEEDED
    - id: failed
      type: terminal
      result: FAILED
    - id: unresolved
      type: terminal
      result: UNRESOLVED
    - id: safe-stopped
      type: terminal
      result: SAFE_STOPPED
