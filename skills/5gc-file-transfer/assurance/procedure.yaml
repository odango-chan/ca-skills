              procedure: observe-session-then-converge
            with:
              supi:
                from: loop.receiver
              pdusessionid:
                from: input.policy-pdu-session-id
              dnn:
                from: input.policy-dnn
              sst:
                from: input.policy-sst
              sd:
                from: input.policy-sd
              fiveqi:
                from: input.policy-five-qi
        'on':
          SUCCEEDED: resolve-member-endpoints
          FAILED: failed
          UNRESOLVED: unresolved
          SAFE_STOPPED: safe-stopped
      resolve-member-endpoints:
        call: transfer.participants.resolve_endpoints
