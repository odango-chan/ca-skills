procedures:
  prepare-file-transfer-normal:
    applicability:
      when: 'request.operation == "prepare_transfer" && request.urgency == "normal"

        '
    start: verify-registration
    nodes:
      verify-registration:
        verify: transfer.participants.registered
        'on':
          PASS: verify-sessions
          FAIL: failed
          UNKNOWN: unresolved
      verify-sessions:
        verify: transfer.participants.pdu_sessions_active
        'on':
          PASS: resolve-member-endpoints
          FAIL: failed
          UNKNOWN: unresolved
      resolve-member-endpoints:
        call: transfer.participants.resolve_endpoints
        with:
          senderImsi:
            from: input.sender-imsi
          receiverImsis:
            from: input.receiver-imsis
        'on':
          SUCCEEDED: ensure-edge-cache
          FAILED: failed
          UNKNOWN: unresolved
          DENIED: failed
      ensure-edge-cache:
        call: edge.cache.ensure
        'on':
          COMMITTED: create-vg
          NOT_COMMITTED: failed
          OUTCOME_UNKNOWN: reconcile-edge-cache
          FAILED: failed
          DENIED: failed
      reconcile-edge-cache:
        call: edge.cache.reconcile
        with:
          transferId:
            from: input.transfer-id
        'on':
          COMMITTED: create-vg
          NOT_COMMITTED: ensure-edge-cache
          UNRESOLVED: unresolved
          FAILED: safe-stopped
          DENIED: safe-stopped
      create-vg:
        call: virtual_group.create
        with:
          transferId:
            from: input.transfer-id
          senderImsi:
            from: input.sender-imsi
          receiverImsis:
            from: input.receiver-imsis
          durationSeconds:
            value: 3600
          fiveQi:
            value: 8
        'on':
          COMMITTED: assign-members
          NOT_COMMITTED: failed
          OUTCOME_UNKNOWN: reconcile-vg-create
          FAILED: failed
          DENIED: failed
      reconcile-vg-create:
        call: virtual_group.reconcile_create
        with:
          transferId:
            from: input.transfer-id
        'on':
          COMMITTED: assign-members
          NOT_COMMITTED: create-vg
          UNRESOLVED: unresolved
          FAILED: safe-stopped
          DENIED: safe-stopped
      assign-members:
        call: virtual_group.assign_members
        with:
          transferId:
            from: input.transfer-id
          groupId:
            from: input.virtual-group-id
          members:
            from: resolve-member-endpoints.output.output.members
        'on':
          COMMITTED: verify-goal
          NOT_COMMITTED: failed
          OUTCOME_UNKNOWN: reconcile-vg-members
          FAILED: failed
          DENIED: failed
      reconcile-vg-members:
        call: virtual_group.reconcile_members
        with:
          transferId:
            from: input.transfer-id
          groupId:
            from: input.virtual-group-id
          members:
            from: resolve-member-endpoints.output.output.members
        'on':
          COMMITTED: verify-goal
          NOT_COMMITTED: assign-members
          UNRESOLVED: unresolved
          FAILED: safe-stopped
          DENIED: safe-stopped
      verify-goal:
        verify: file_transfer.request.satisfied
        'on':
          PASS: done
          FAIL: failed
          UNKNOWN: unresolved
      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
      unresolved:
        terminal: UNRESOLVED
      safe-stopped:
        terminal: SAFE_STOPPED
    inputs:
      receiver-imsis:
        type: array
        from: context.request.receiverImsis
      sender-imsi:
        type: string
        from: context.request.senderImsi
      transfer-id:
        type: string
        from: context.request.transferId
      virtual-group-id:
        type: string
        from: context.facts.virtual_group.id
