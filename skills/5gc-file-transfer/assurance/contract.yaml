apiVersion: connectionagent.io/v1alpha1
kind: SkillContract
metadata:
  name: 5gc-file-transfer
spec:
  skillType: executable
  goal: file_transfer.orchestrate
  inputs:
    requestSchema: schemas/file-transfer-request.schema.yaml
  context:
    requiredFacts:
    - transfer.operation.prepare
    - transfer.operation.release
    - transfer.intent.urgent
    - transfer.participants.registered
    - transfer.participants.pdu_sessions_active
    - file_transfer.request.satisfied
  allowedResources:
    capabilities:
    - transfer.participants.registration.query
    - transfer.participants.session.query
    - edge.cache.ensure
    - edge.cache.reconcile
    - virtual_group.create
    - virtual_group.reconcile_create
    - virtual_group.assign_members
    - virtual_group.reconcile_members
    - transfer.qos.boost
    - transfer.qos.reconcile
    - virtual_group.release
    - virtual_group.reconcile_release
    localTools: []
  requirements:
  - predicate: file_transfer.request.satisfied
    expect: PASS
    satisfiable: true
  postconditions:
  - predicate: file_transfer.request.satisfied
    expect: PASS
  planning:
    maxActions: 12
    allowDynamicProcedure: false
  failureSemantics:
    outcomeUnknown:
      requireReconcile: true
