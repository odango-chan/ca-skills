apiVersion: connectionagent.io/v1alpha1
kind: SkillContract
metadata:
  name: 5gc-file-transfer
spec:
  skillType: executable
  goal: file_transfer.orchestrate
  inputs:
    requestSchema: schemas/file-transfer-request.schema.yaml
  allowedResources:
    capabilities:
    - ue.identity.lookup
    - transfer.participants.resolve_endpoints
    - edge.cache.ensure
    - edge.cache.reconcile
    - virtual_group.create
    - virtual_group.reconcile_create
    - virtual_group.assign_members
    - virtual_group.reconcile_members
    - transfer.qos.boost
    - transfer.qos.reconcile
    - virtual_group.release
    - virtual_group.reconcile_release
    localTools: []
  postconditions:
  - predicate: file_transfer.request.satisfied
    expect: PASS
  # Certified supporting executable Skills reused by compile-time composition.
  # artifactRef + digest pin the frozen source package. The compiler resolves the
  # sibling checkout, verifies the digest and fails closed on any mismatch. The
  # digests are the `sourcePackageDigest` values produced by
  # `python3 -B scripts/verify.py --compile skills/<name>` on ca-skills main.
  dependencies:
  # This dependency supplies the owner PredicateDefinition used to gate
  # prepare procedures. Its registration Procedure is never composed here.
  - name: ue-registration
    artifactRef: ue-registration
    digest: sha256:8c82c4b7eaa901fb4ad4e532d7db84e332168916f42a5fb25333e379cf7fbdc1
  - name: ensure-session-qos
    artifactRef: ensure-session-qos
    digest: sha256:d63b1a51846a51c39d2ef90eff9d0e0daffdefb86b6a3c23578878b3cb02d034
  planning:
    maxActions: 89
    allowDynamicProcedure: false
    # parentActions = worst-case parent-level action nodes on one urgent path:
    # resolve-member-endpoints, edge.cache.ensure/reconcile,
    # virtual_group.create/reconcile_create, assign_members/reconcile_members,
    # transfer.qos.boost/reconcile = 9.
    # Registration gates prepare Procedure applicability; it is not a child
    # procedure. The
    # only composed child is ensure-session-qos: 16x5 actions at the request
    # schema's maxItems bound. Runtime remains the enforcing authority.
    budgetPartition:
      parentActions: 9
      childActions: 80
  failureSemantics:
    outcomeUnknown:
      requireReconcile: true
