apiVersion: connectionagent.io/v1alpha1
kind: PredicateSet
metadata:
  skill: 5gc-file-transfer
predicates:
  # The two former participant prerequisites
  # (transfer.participants.registered, transfer.participants.pdu_sessions_active)
  # are deleted. They referenced ObservationRefs with no Runtime/Sandbox owner,
  # and they hard-coded sst/sd. Participant registration and baseline session/QoS
  # readiness are no longer asserted here: they are converged and independently
  # proven by the composed ue-registration and ensure-session-qos procedures,
  # each of which owns its own ObservationRefs and predicates.
  #
  # file_transfer.request.satisfied remains the single independent final-goal
  # proof for this Skill.
  file_transfer.request.satisfied:
    observations:
      virtualGroup:
        ref: virtual_group.snapshot
        # The virtual-group resource is keyed by the business transferId
        # (gateway-owned, present on the request) for prepare_transfer. The
        # group id is produced during execution and must not be read from a
        # pre-run fact; release_group addresses the resource by its groupId.
        scope: >
          request.operation == "release_group"
            ? {"transferId": request.transferId, "groupId": request.groupId}
            : {"transferId": request.transferId}
        freshness: 5s
      qosBoost:
        ref: transfer.qos.boost_state
        scope: >
          {"transferId": request.transferId}
        freshness: 5s
        when: request.operation == "prepare_transfer" && request.urgency == "urgent"
    evaluator:
      type: script
      ref: skill.evaluate-transfer-request-satisfied
