apiVersion: connectionagent.io/v1alpha1
kind: EvidenceRules
metadata:
  skill: core5g-file-transfer
predicates:
  transfer.participants.registered:
    requiredObservations:
      participants:
        ref: transfer.participants.registration
    freshness:
      maxAge: 5s
    acquisition:
      participants:
        preferred:
        - source: runtime_state
        - source: signaling_observation
        activeObservation:
          ref: transfer.participants.registration.query

  transfer.participants.pdu_sessions_active:
    requiredObservations:
      participants:
        ref: transfer.participants.session
    freshness:
      maxAge: 5s
    acquisition:
      participants:
        preferred:
        - source: runtime_state
        - source: signaling_observation
        activeObservation:
          ref: transfer.participants.session.query

  file_transfer.request.satisfied:
    requiredObservations:
      virtualGroup:
        ref: virtual_group.snapshot
      qosBoost:
        ref: transfer.qos.boost_state
        when: request.operation == "prepare_transfer" && request.urgency == "urgent"
    freshness:
      maxAge: 5s
    acquisition:
      virtualGroup:
        preferred:
        - source: runtime_state
        - source: signaling_observation
        activeObservation:
          ref: virtual_group.status
      qosBoost:
        preferred:
        - source: tool_result
          ref: transfer.qos.boost
