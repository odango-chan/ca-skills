apiVersion: connectionagent.io/v1alpha1
kind: PredicateSet
metadata:
  skill: core5g-file-transfer
predicates:
  transfer.operation.prepare:
    evaluator:
      type: cel
      expression: request.operation == "prepare_transfer"
      passReasonCode: TRANSFER_PREPARE_REQUESTED
      failReasonCode: TRANSFER_PREPARE_NOT_REQUESTED

  transfer.operation.release:
    evaluator:
      type: cel
      expression: request.operation == "release_group"
      passReasonCode: TRANSFER_RELEASE_REQUESTED
      failReasonCode: TRANSFER_RELEASE_NOT_REQUESTED

  transfer.intent.urgent:
    evaluator:
      type: cel
      expression: request.urgency == "urgent"
      passReasonCode: TRANSFER_URGENT
      failReasonCode: TRANSFER_NOT_URGENT

  transfer.participants.registered:
    observations:
      participants:
        ref: transfer.participants.registration
        freshness: 5s
    evaluator:
      type: cel
      expression: >
        observations.participants.all(p,
          p.registrationState == "REGISTERED"
        )
      passReasonCode: ALL_PARTICIPANTS_REGISTERED
      failReasonCode: PARTICIPANT_NOT_REGISTERED

  transfer.participants.pdu_sessions_active:
    observations:
      participants:
        ref: transfer.participants.session
        freshness: 5s
    evaluator:
      type: cel
      expression: >
        observations.participants.all(p,
          p.sessionState == "ACTIVE"
        )
      passReasonCode: ALL_PARTICIPANT_SESSIONS_ACTIVE
      failReasonCode: PARTICIPANT_SESSION_INACTIVE

  file_transfer.request.satisfied:
    observations:
      virtualGroup:
        ref: virtual_group.snapshot
        freshness: 5s
      qosBoost:
        ref: transfer.qos.boost_state
        freshness: 5s
        when: request.operation == "prepare_transfer" && request.urgency == "urgent"
    evaluator:
      type: script
      ref: skill.evaluate-transfer-request-satisfied
