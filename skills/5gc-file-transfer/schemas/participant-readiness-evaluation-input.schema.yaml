$schema: https://json-schema.org/draft/2020-12/schema
$id: participant-readiness-evaluation-input.schema.yaml
title: ParticipantReadinessEvaluationInput
type: object
required: [members]
properties:
  members:
    type: array
    minItems: 1
    items:
      type: object
      required: [imsi, registrationState, sessionState]
      properties:
        imsi:
          type: string
          pattern: '^[0-9]{15}$'
        registrationState:
          type: string
          enum: [REGISTERED, NOT_REGISTERED, UNKNOWN]
        sessionState:
          type: string
          enum: [ACTIVE, INACTIVE, UNKNOWN]
        observationIds:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
      additionalProperties: false
additionalProperties: false
