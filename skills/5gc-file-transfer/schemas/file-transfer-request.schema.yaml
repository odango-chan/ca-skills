$schema: https://json-schema.org/draft/2020-12/schema
$id: file-transfer-request.schema.yaml
title: FiveGcFileTransferRequest
type: object
required:
- operation
- transferId
properties:
  operation:
    type: string
    enum: [prepare_transfer, release_group]
  transferId:
    type: string
    minLength: 1
    description: Gateway-owned file-transfer lifecycle and correlation identifier.
  urgency:
    type: string
    enum: [normal, urgent]
    description: Canonical urgency derived from the original user intent before deterministic execution.
  senderImsi:
    type: string
    pattern: '^[0-9]{15}$'
  receiverImsis:
    type: array
    minItems: 1
    maxItems: 16
    uniqueItems: true
    description: Bounded canonical receiver set. Current participant endpoint addresses are resolved by governed execution rather than supplied by the routing Agent.
    items:
      type: string
      pattern: '^[0-9]{15}$'
  networkPolicy:
    type: object
    description: >-
      Canonical baseline 5GC network policy for this transfer. Shape is owned by
      ca-skills; values are owned by the business materialization / gateway that
      invokes the Skill. The same values feed the composed ensure-session-qos
      input, virtual-group creation and final verification so no second authority
      exists. Urgent acceleration is a distinct transfer.qos.boost path and is
      not expressed here. See docs/network-policy-identity.md.
    required:
    - dnn
    - sst
    - sd
    - pduSessionId
    - fiveQi
    properties:
      dnn:
        type: string
        minLength: 1
        maxLength: 100
        description: Data Network Name used by the baseline PDU session.
      sst:
        type: integer
        minimum: 0
        maximum: 255
        description: Slice/Service Type of the requested S-NSSAI.
      sd:
        type: string
        pattern: '^[0-9A-Fa-f]{6}$'
        description: Slice Differentiator of the requested S-NSSAI (6 hex digits).
      pduSessionId:
        type: integer
        minimum: 1
        maximum: 15
        description: Canonical PDU Session identity for this transfer's participants.
      fiveQi:
        type: integer
        minimum: 1
        maximum: 255
        description: >-
          Single canonical baseline 5QI applied to the converged PDU session and
          to the virtual group. Urgent acceleration is separate.
    additionalProperties: false
  groupId:
    type: string
    pattern: '^vg-[0-9]{8}-[0-9]{3}$'
  outcome:
    type: string
    enum: [completed, cancelled]
allOf:
- if:
    properties:
      operation: {const: prepare_transfer}
    required: [operation]
  then:
    required:
    - urgency
    - senderImsi
    - receiverImsis
    - networkPolicy
- if:
    properties:
      operation: {const: release_group}
    required: [operation]
  then:
    required:
    - groupId
    - outcome
additionalProperties: false
