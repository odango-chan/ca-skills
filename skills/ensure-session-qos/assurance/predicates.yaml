apiVersion: connectionagent.io/v1alpha1
kind: PredicateSet
metadata:
  skill: ensure-session-qos
predicates:
  ue.registered:
    observations:
      registration:
        ref: ue.registration.snapshot
        scope: >
          {"ueRef": subject.ueRef}
        freshness: 5s
    evaluator:
      type: cel
      expression: observations.registration.registrationState == "REGISTERED"
  pdu_session.established:
    observations:
      session:
        ref: pdu.session.snapshot
        scope: >
          {"ueRef": subject.supi, "pduSessionId": subject.pduSessionId}
        freshness: 5s
    evaluator:
      type: cel
      expression: observations.session.established == true
  pdu_session.qos.satisfied:
    observations:
      session:
        ref: pdu.session.snapshot
        scope: >
          {"ueRef": subject.supi, "pduSessionId": subject.pduSessionId}
        freshness: 5s
    evaluator:
      type: cel
      expression: observations.session.qosSatisfied == true
  user_plane.connectivity.available:
    observations:
      connectivity:
        ref: user.plane.connectivity.snapshot
        scope: >
          {"ueRef": subject.supi, "pduSessionId": subject.pduSessionId}
        freshness: 5s
    evaluator:
      type: cel
      expression: observations.connectivity.available == true
