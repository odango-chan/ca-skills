procedures:
  session-qos-already-satisfied:
    start: verify-session-goal
    nodes:
      verify-session-goal:
        verify: pdu_session.established
        'on':
          PASS: verify-session-goal-2
          FAIL: failed
          UNKNOWN: unresolved
      verify-session-goal-2:
        verify: pdu_session.qos.satisfied
        'on':
          PASS: verify-session-goal-3
          FAIL: failed
          UNKNOWN: unresolved
      verify-session-goal-3:
        verify: user_plane.connectivity.available
        'on':
          PASS: done
          FAIL: failed
          UNKNOWN: unresolved
      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
      unresolved:
        terminal: UNRESOLVED
    applicability:
      predicates:
        pdu_session.established: PASS
        pdu_session.qos.satisfied: PASS
