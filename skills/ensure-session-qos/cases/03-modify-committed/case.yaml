apiVersion: connectionagent.io/v1alpha1
kind: SkillTestCase
metadata:
  skill: ensure-session-qos
  name: 03-modify-committed
spec:
  classes:
  - session_modify
  purpose: 已有 Session 但 QoS 不满足时选择修改路径。
  context:
    apiVersion: connectionagent.io/v1alpha1
    kind: PlanningContext
    metadata:
      operationId: session-03-modify-committed
      version: 1
    subject:
      supi: imsi-001010000000001
      pduSessionId: 10
    request:
      dnn: internet
      sst: 1
      sd: '010203'
      fiveQi: 7
    facts:
      ue.registered:
        value: PASS
      pdu_session.established:
        value: PASS
      pdu_session.qos.satisfied:
        value: FAIL
      user_plane.connectivity.available:
        value: PASS
    availableResources:
    - ref: pdu_session.query
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: user_plane.probe
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: pdu_session.modify_qos
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: pdu_session.reconcile
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    constraints:
      maxActions: 8
  expect:
    procedure: modify-existing-session-qos
    planningStatus: READY_AFTER_REQUIREMENT
    terminal: SUCCEEDED
    postconditions:
    - predicate: pdu_session.established
      expect: PASS
      actual: PASS
    - predicate: pdu_session.qos.satisfied
      expect: PASS
      actual: PASS
    - predicate: user_plane.connectivity.available
      expect: PASS
      actual: PASS
    trace:
      match: exact
      ordered:
      - nodeId: modify-session-qos
        outcome: COMMITTED
      - nodeId: verify-session-goal
        outcome: PASS
      - nodeId: verify-session-goal-2
        outcome: PASS
      - nodeId: verify-session-goal-3
        outcome: PASS
  fixtures:
    actions:
      modify-session-qos: COMMITTED
    predicates:
      verify-session-goal:
        pdu_session.established: PASS
      verify-session-goal-2:
        pdu_session.qos.satisfied: PASS
      verify-session-goal-3:
        user_plane.connectivity.available: PASS
