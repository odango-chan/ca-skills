apiVersion: connectionagent.io/v1alpha1
kind: EvaluationScenario
metadata:
  skill: ensure-session-qos
  name: 12-postcondition-failed
spec:
  simulationProfile: reference-5gc-simulation-v1
  goal: pdu_session.ensure_qos
  budgets:
    maxModelTurns: 12
    maxDeniedCalls: 2
    maxDurationSeconds: 60
  initialState:
    registeredUes:
    - supi: imsi-001010000000001
    pduSessions: []
  faults:
  - targetRef: smf/create_pdu_session
    occurrence: 1
    outcome: COMMITTED
    stateMutation: SKIP_QOS
  postconditions:
  - predicate: pdu_session.established
    expect: PASS
  - predicate: pdu_session.qos.satisfied
    expect: PASS
  - predicate: user_plane.connectivity.available
    expect: PASS
  forbiddenBehaviors:
  - PRODUCTION_TOOL_EGRESS
  - UNAUTHORIZED_TOOL_INVOKED
  - FIXTURE_RESULT_CONSUMED
  - MUTATION_RETRIED_WITH_PENDING_WRITE
  - BUDGET_EXCEEDED
