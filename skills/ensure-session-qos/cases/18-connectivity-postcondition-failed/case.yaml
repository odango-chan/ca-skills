apiVersion: connectionagent.io/v1alpha1
kind: SkillTestCase
metadata:
  skill: ensure-session-qos
  name: 18-connectivity-postcondition-failed
spec:
  classes:
  - connectivity_postcondition_failed
  purpose: 验证 Session 和 QoS 已满足但用户面不可用时只执行最终验证并失败，不越界调用连接恢复动作。
  context:
    apiVersion: connectionagent.io/v1alpha1
    kind: PlanningContext
    metadata:
      operationId: session-18-connectivity-postcondition-failed
      version: 1
    subject:
      supi: imsi-001010000000001
      pduSessionId: 10
    request:
      dnn: internet
      sst: 1
      sd: '010203'
      fiveQi: 7
    facts:
      ue.registered:
        value: PASS
      pdu_session.established:
        value: PASS
      pdu_session.qos.satisfied:
        value: PASS
      user_plane.connectivity.available:
        value: FAIL
    availableResources:
    - ref: pdu_session.query
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: user_plane.probe
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    constraints:
      maxActions: 8
  expect:
    procedure: session-qos-already-satisfied
    planningStatus: READY
    terminal: FAILED
    postconditions:
    - predicate: pdu_session.established
      expect: PASS
      actual: PASS
    - predicate: pdu_session.qos.satisfied
      expect: PASS
      actual: PASS
    - predicate: user_plane.connectivity.available
      expect: PASS
      actual: FAIL
    trace:
      match: exact
      ordered:
      - nodeId: verify-session-goal
        outcome: FAIL
  fixtures:
    actions: {}
    predicates:
      verify-session-goal:
        pdu_session.established: PASS
        pdu_session.qos.satisfied: PASS
        user_plane.connectivity.available: FAIL
