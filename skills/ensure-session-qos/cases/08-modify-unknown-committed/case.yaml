apiVersion: connectionagent.io/v1alpha1
kind: SkillTestCase
metadata:
  skill: ensure-session-qos
  name: 08-modify-unknown-committed
spec:
  classes:
  - modification_unknown_committed
  purpose: QoS 修改结果未知时调和确认已提交后再验证。
  context:
    apiVersion: connectionagent.io/v1alpha1
    kind: PlanningContext
    metadata:
      operationId: session-08-modify-unknown-committed
      version: 1
    subject:
      supi: imsi-001010000000001
      pduSessionId: 10
    request:
      dnn: internet
      sst: 1
      sd: '010203'
      fiveQi: 7
    facts:
      ue.registered:
        value: PASS
      pdu_session.established:
        value: PASS
      pdu_session.qos.satisfied:
        value: FAIL
      user_plane.connectivity.available:
        value: PASS
    availableResources:
    - ref: pdu_session.query
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: user_plane.probe
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: pdu_session.modify_qos
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: pdu_session.reconcile
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    constraints:
      maxActions: 8
  expect:
    procedure: modify-existing-session-qos
    planningStatus: READY_AFTER_REQUIREMENT
    terminal: SUCCEEDED
    postconditions:
    - predicate: pdu_session.established
      expect: PASS
      actual: PASS
    - predicate: pdu_session.qos.satisfied
      expect: PASS
      actual: PASS
    - predicate: user_plane.connectivity.available
      expect: PASS
      actual: PASS
    trace:
      match: exact
      ordered:
      - nodeId: modify-session-qos
        outcome: OUTCOME_UNKNOWN
      - nodeId: reconcile-modify
        outcome: COMMITTED
      - nodeId: verify-session-goal
        outcome: PASS
      forbiddenImmediateRetryAfterUnknown: true
  fixtures:
    actions:
      modify-session-qos: OUTCOME_UNKNOWN
      reconcile-modify: COMMITTED
    predicates:
      verify-session-goal:
        pdu_session.established: PASS
        pdu_session.qos.satisfied: PASS
        user_plane.connectivity.available: PASS
