apiVersion: connectionagent.io/v1alpha1
kind: SkillTestCase
metadata:
  skill: ensure-session-qos
  name: 15-budget-exhausted
spec:
  classes:
  - budget_exhausted
  purpose: 调和确认未提交后，重试写操作将超预算时失败。
  context:
    apiVersion: connectionagent.io/v1alpha1
    kind: PlanningContext
    metadata:
      operationId: session-15-budget-exhausted
      version: 1
    subject:
      supi: imsi-001010000000001
      pduSessionId: 10
    request:
      dnn: internet
      sst: 1
      sd: '010203'
      fiveQi: 7
    facts:
      ue.registered:
        value: PASS
      pdu_session.established:
        value: FAIL
      pdu_session.qos.satisfied:
        value: FAIL
      user_plane.connectivity.available:
        value: FAIL
    availableResources:
    - ref: pdu_session.query
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: user_plane.probe
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: pdu_session.create
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: pdu_session.reconcile
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    constraints:
      maxActions: 2
  expect:
    procedure: create-session-with-qos
    planningStatus: READY_AFTER_REQUIREMENT
    terminal: FAILED
    errorCode: ACTION_BUDGET_EXHAUSTED
    postconditions:
    - predicate: pdu_session.established
      expect: PASS
      actual: NOT_EVALUATED
    - predicate: pdu_session.qos.satisfied
      expect: PASS
      actual: NOT_EVALUATED
    - predicate: user_plane.connectivity.available
      expect: PASS
      actual: NOT_EVALUATED
    trace:
      match: exact
      ordered:
      - nodeId: create-session
        outcome: OUTCOME_UNKNOWN
      - nodeId: reconcile-create
        outcome: NOT_COMMITTED
      forbiddenImmediateRetryAfterUnknown: true
  fixtures:
    actions:
      create-session: OUTCOME_UNKNOWN
      reconcile-create: NOT_COMMITTED
