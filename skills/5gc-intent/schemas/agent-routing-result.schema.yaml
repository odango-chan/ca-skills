$schema: https://json-schema.org/draft/2020-12/schema
$id: agent-routing-result.schema.yaml
title: AgentRoutingResultPayload
description: >-
  Model-facing routing payload for Agent-owned 5GC intent routing. This is a
  Skill-local semantic schema, not a top-level Runtime execution contract.
type: object
required:
  - requestId
  - status
properties:
  requestId:
    type: string
    minLength: 1
    description: Correlation key copied from the normalized intent request.
  status:
    type: string
    enum:
      - RESOLVED
      - NEEDS_CONTEXT
      - NEEDS_EXTENSION
  selection:
    type: object
    required:
      - skill
    properties:
      skill:
        type: string
        minLength: 1
        description: Semantic Skill identity selected from the admitted discovery set.
      variant:
        type: string
        minLength: 1
        description: Optional admitted/certified Variant selector.
      entrypoint:
        type: string
        minLength: 1
        description: Optional governed entrypoint selected for the Skill.
    additionalProperties: false
  request:
    type: object
    description: >-
      Optional normalized planning handoff containing only context already known
      from the Goal/gateway. It is not necessarily the selected Skill's final
      execution input; selected-Skill planning may still perform governed
      read-only identity/state lookups before producing the execution request.
    additionalProperties: true
  reasonCode:
    type: string
    minLength: 1
    description: Stable reason for NEEDS_CONTEXT or NEEDS_EXTENSION.
allOf:
  - if:
      properties:
        status:
          const: RESOLVED
    then:
      required:
        - selection
  - if:
      properties:
        status:
          enum:
            - NEEDS_CONTEXT
            - NEEDS_EXTENSION
    then:
      required:
        - reasonCode
      not:
        required:
          - selection
additionalProperties: false
