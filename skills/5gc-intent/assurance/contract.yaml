apiVersion: connectionagent.io/v1alpha1
kind: SkillContract
metadata:
  name: core5g-intent
spec:
  skillType: executable
  goal: core5g.intent.resolve_execution_target
  inputs:
    requestSchema: schemas/5gc-intent-request.schema.yaml
  context:
    requiredFacts:
    - core5g.execution_target.resolved
  allowedResources:
    capabilities: []
    localTools: []
  requirements:
  - predicate: core5g.execution_target.resolved
    expect: PASS
    satisfiable: true
  postconditions:
  - predicate: core5g.execution_target.resolved
    expect: PASS
  planning:
    maxActions: 1
    allowDynamicProcedure: false
