apiVersion: connectionagent.io/v1alpha1
kind: SkillTestCase
metadata:
  skill: query-weather-for-ue
  name: 14-reconcile-failed
spec:
  classes:
  - reconcile_failed
  purpose: 验证调和调用失败不能清除待决写，必须进入安全停止。
  context:
    apiVersion: connectionagent.io/v1alpha1
    kind: PlanningContext
    metadata:
      operationId: op-14-reconcile-failed
      version: 1
    subject:
      supi: imsi-001010000000001
      pduSessionId: 10
    request:
      city: Tokyo
      unit: celsius
    facts:
      ue.registered:
        value: PASS
      user_plane.connectivity.available:
        value: FAIL
    availableResources:
    - ref: pdu_session.ensure
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: pdu_session.reconcile
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: user_plane.probe
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: external.weather.query
      kind: capability
      version: v1
      effect: read_only
      invocable: false
      blockedBy:
      - user_plane.connectivity.available
    constraints:
      maxActions: 8
  expect:
    procedure: query-weather
    planningStatus: READY_AFTER_REQUIREMENT
    terminal: SAFE_STOPPED
    postconditions:
    - predicate: service.weather.query.succeeded
      expect: PASS
      actual: NOT_EVALUATED
    trace:
      match: exact
      ordered:
      - nodeId: verify-connectivity
        outcome: FAIL
      - nodeId: ensure-connectivity
        outcome: OUTCOME_UNKNOWN
      - nodeId: reconcile-connectivity
        outcome: FAILED
      forbiddenImmediateRetryAfterUnknown: true
  fixtures:
    actions:
      ensure-connectivity: OUTCOME_UNKNOWN
      reconcile-connectivity: FAILED
    predicates:
      verify-connectivity:
        user_plane.connectivity.available: FAIL
