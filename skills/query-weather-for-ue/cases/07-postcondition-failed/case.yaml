apiVersion: connectionagent.io/v1alpha1
kind: SkillTestCase
metadata:
  skill: query-weather-for-ue
  name: 07-postcondition-failed
spec:
  classes:
  - postcondition_failed
  purpose: 验证动作成功不等于 Skill 成功，后置条件失败必须进入失败终点。
  context:
    apiVersion: connectionagent.io/v1alpha1
    kind: PlanningContext
    metadata:
      operationId: op-07-postcondition-failed
      version: 1
    subject:
      supi: imsi-001010000000001
      pduSessionId: 10
    request:
      city: Tokyo
      unit: celsius
    facts:
      ue.registered:
        value: PASS
      user_plane.connectivity.available:
        value: PASS
    availableResources:
    - ref: pdu_session.ensure
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: pdu_session.reconcile
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: user_plane.probe
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: external.weather.query
      kind: capability
      version: v1
      effect: read_only
      invocable: true
      blockedBy: []
    constraints:
      maxActions: 8
  expect:
    procedure: query-weather
    planningStatus: READY
    terminal: FAILED
    postconditions:
    - predicate: service.weather.query.succeeded
      expect: PASS
      actual: FAIL
    trace:
      match: exact
      ordered:
      - nodeId: verify-connectivity
        outcome: PASS
      - nodeId: query-weather
        outcome: SUCCEEDED
      - nodeId: normalize-weather
        outcome: SUCCEEDED
      - nodeId: verify-weather-result
        outcome: FAIL
  fixtures:
    actions:
      query-weather: SUCCEEDED
      normalize-weather: SUCCEEDED
    predicates:
      verify-connectivity:
        user_plane.connectivity.available: PASS
      verify-weather-result:
        service.weather.query.succeeded: FAIL
