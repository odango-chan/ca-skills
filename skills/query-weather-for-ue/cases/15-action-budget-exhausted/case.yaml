apiVersion: connectionagent.io/v1alpha1
kind: SkillTestCase
metadata:
  skill: query-weather-for-ue
  name: 15-action-budget-exhausted
spec:
  classes:
  - budget_exhausted
  purpose: 验证待决写已确认未提交后，下一次写会超预算时确定性失败。
  context:
    apiVersion: connectionagent.io/v1alpha1
    kind: PlanningContext
    metadata:
      operationId: op-15-action-budget-exhausted
      version: 1
    subject:
      supi: imsi-001010000000001
      pduSessionId: 10
    request:
      city: Tokyo
      unit: celsius
    facts:
      ue.registered:
        value: PASS
      user_plane.connectivity.available:
        value: FAIL
    availableResources:
    - ref: pdu_session.ensure
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: pdu_session.reconcile
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: user_plane.probe
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: external.weather.query
      kind: capability
      version: v1
      effect: read_only
      invocable: false
      blockedBy:
      - user_plane.connectivity.available
    constraints:
      maxActions: 2
  expect:
    procedure: query-weather
    planningStatus: READY_AFTER_REQUIREMENT
    terminal: FAILED
    errorCode: ACTION_BUDGET_EXHAUSTED
    postconditions:
    - predicate: service.weather.query.succeeded
      expect: PASS
      actual: NOT_EVALUATED
    trace:
      match: exact
      ordered:
      - nodeId: verify-connectivity
        outcome: FAIL
      - nodeId: ensure-connectivity
        outcome: OUTCOME_UNKNOWN
      - nodeId: reconcile-connectivity
        outcome: NOT_COMMITTED
      forbiddenImmediateRetryAfterUnknown: true
  fixtures:
    actions:
      ensure-connectivity: OUTCOME_UNKNOWN
      reconcile-connectivity: NOT_COMMITTED
    predicates:
      verify-connectivity:
        user_plane.connectivity.available: FAIL
