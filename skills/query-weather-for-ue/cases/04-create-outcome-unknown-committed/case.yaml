apiVersion: connectionagent.io/v1alpha1
kind: SkillTestCase
metadata:
  skill: query-weather-for-ue
  name: 04-create-outcome-unknown-committed
spec:
  classes:
  - outcome_unknown_committed
  purpose: 验证不确定写结果先调和，确认已提交后继续验证和查询。
  context:
    apiVersion: connectionagent.io/v1alpha1
    kind: PlanningContext
    metadata:
      operationId: op-04-create-outcome-unknown-committed
      version: 1
    subject:
      supi: imsi-001010000000001
      pduSessionId: 10
    request:
      city: Tokyo
      unit: celsius
    facts:
      ue.registered:
        value: PASS
      user_plane.connectivity.available:
        value: FAIL
    availableResources:
    - ref: pdu_session.ensure
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: pdu_session.reconcile
      kind: capability
      version: v1
      effect: mutation
      invocable: true
    - ref: user_plane.probe
      kind: capability
      version: v1
      effect: read_only
      invocable: true
    - ref: external.weather.query
      kind: capability
      version: v1
      effect: read_only
      invocable: false
      blockedBy:
      - user_plane.connectivity.available
    constraints:
      maxActions: 8
  expect:
    procedure: query-weather
    planningStatus: READY_AFTER_REQUIREMENT
    terminal: SUCCEEDED
    postconditions:
    - predicate: service.weather.query.succeeded
      expect: PASS
      actual: PASS
    trace:
      match: ordered_subsequence
      ordered:
      - nodeId: verify-connectivity
        outcome: FAIL
      - nodeId: ensure-connectivity
        outcome: OUTCOME_UNKNOWN
      - nodeId: reconcile-connectivity
        outcome: COMMITTED
      - nodeId: verify-connectivity
        outcome: PASS
      - nodeId: verify-weather-result
        outcome: PASS
      forbiddenImmediateRetryAfterUnknown: true
      resourceUnlocks:
      - resource: external.weather.query
        afterNode: verify-connectivity
        predicate: user_plane.connectivity.available
  fixtures:
    actions:
      ensure-connectivity: OUTCOME_UNKNOWN
      reconcile-connectivity: COMMITTED
      query-weather: SUCCEEDED
      normalize-weather: SUCCEEDED
    predicates:
      verify-connectivity:
        user_plane.connectivity.available:
        - FAIL
        - PASS
      verify-weather-result:
        service.weather.query.succeeded: PASS
    simulation:
      apiVersion: connectionagent.io/v1alpha1
      kind: EvaluationScenario
      metadata:
        skill: query-weather-for-ue
        name: 04-create-outcome-unknown-committed
      spec:
        simulationProfile: reference-5gc-simulation-v1
        goal: weather.query_for_ue
        budgets:
          maxModelTurns: 12
          maxDeniedCalls: 2
          maxDurationSeconds: 60
        initialState:
          registeredUes:
          - supi: imsi-001010000000001
          pduSessions: []
          weatherResponses:
          - city: Tokyo
            unit: celsius
            response:
              city: Tokyo
              temperature: 22.5
              condition: Clear
        faults:
        - targetRef: smf/ensure_pdu_session
          occurrence: 1
          outcome: OUTCOME_UNKNOWN
          unknownDisposition: COMMITTED
        postconditions:
        - predicate: service.weather.query.succeeded
          expect: PASS
        forbiddenBehaviors:
        - PRODUCTION_TOOL_EGRESS
        - UNAUTHORIZED_TOOL_INVOKED
        - FIXTURE_RESULT_CONSUMED
        - MUTATION_RETRIED_WITH_PENDING_WRITE
        - BUDGET_EXCEEDED
