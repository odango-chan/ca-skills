procedures:
  query-weather:
    inputs:
      supi:
        type: string
        from: context.subject.supi
      pdusessionid:
        type: integer
        from: context.subject.pduSessionId
      city:
        type: string
        from: context.request.city
      unit:
        type: string
        from: context.request.unit
    start: verify-connectivity
    nodes:
      verify-connectivity:
        verify: user_plane.connectivity.available
        'on':
          PASS: query-weather
          FAIL: ensure-connectivity
          UNKNOWN: probe-connectivity
      probe-connectivity:
        call: user_plane.probe
        with:
          supi:
            from: input.supi
          pduSessionId:
            from: input.pdusessionid
        'on':
          UNKNOWN: unresolved
          DENIED: failed
          SUCCEEDED: verify-connectivity
          FAILED: ensure-connectivity
      ensure-connectivity:
        call: pdu_session.ensure
        with:
          supi:
            from: input.supi
          pduSessionId:
            from: input.pdusessionid
        'on':
          COMMITTED: verify-connectivity
          NOT_COMMITTED: failed
          OUTCOME_UNKNOWN: reconcile-connectivity
          FAILED: failed
          DENIED: failed
      reconcile-connectivity:
        call: pdu_session.reconcile
        'on':
          COMMITTED: verify-connectivity
          NOT_COMMITTED: ensure-connectivity
          UNRESOLVED: unresolved
          FAILED: safe-stopped
          DENIED: safe-stopped
      query-weather:
        call: external.weather.query
        with:
          city:
            from: input.city
          unit:
            from: input.unit
        'on':
          SUCCEEDED: normalize-weather
          FAILED: failed
          DENIED: failed
      normalize-weather:
        script: scripts/normalize_weather_result.py
        with:
          city:
            from: query-weather.output.city
          temperature:
            from: query-weather.output.temperature
          condition:
            from: query-weather.output.condition
        'on':
          SUCCEEDED: persist-weather-result
          FAILED: failed
      persist-weather-result:
        tool: skill.normalize-weather-result
        with:
          input:
            from: query-weather.output
        'on':
          SUCCEEDED: verify-weather-result
          FAILED: failed
          DENIED: failed
      verify-weather-result:
        verify: service.weather.query.succeeded
        'on':
          PASS: done
          FAIL: failed
          UNKNOWN: unresolved
      done:
        terminal: SUCCEEDED
      failed:
        terminal: FAILED
      unresolved:
        terminal: UNRESOLVED
      safe-stopped:
        terminal: SAFE_STOPPED
