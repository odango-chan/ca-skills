procedures:
  ensure-registration:
    inputs:
      ue-ref:
        type: string
        from: context.subject.ueRef
      registration-type:
        type: string
        from: context.request.registrationType
    start: verify-current-registration
    nodes:
      verify-current-registration:
        verify: ue.registered
        'on': {PASS: verify-registration-context, FAIL: resolve-identity, UNKNOWN: unresolved}
      verify-registration-context:
        verify: ue.registration_context.consistent
        'on': {PASS: done, FAIL: failed, UNKNOWN: unresolved}
      resolve-identity:
        call: ue.identity.resolve
        with: {ueRef: {from: input.ue-ref}}
        'on': {SUCCEEDED: verify-identity, FAILED: failed, UNKNOWN: unresolved, DENIED: failed}
      verify-identity:
        verify: ue.identity.resolved
        'on': {PASS: authenticate, FAIL: failed, UNKNOWN: unresolved}
      authenticate:
        call: ue.authentication.execute
        with: {ueRef: {from: input.ue-ref}, registrationType: {from: input.registration-type}}
        'on': {COMMITTED: verify-authentication, NOT_COMMITTED: failed, OUTCOME_UNKNOWN: safe-stopped, FAILED: failed, DENIED: failed}
      verify-authentication:
        verify: ue.authentication.succeeded
        'on': {PASS: establish-security, FAIL: failed, UNKNOWN: unresolved}
      establish-security:
        call: ue.security.establish
        with: {ueRef: {from: input.ue-ref}, registrationType: {from: input.registration-type}}
        'on': {COMMITTED: verify-security, NOT_COMMITTED: failed, OUTCOME_UNKNOWN: safe-stopped, FAILED: failed, DENIED: failed}
      verify-security:
        verify: ue.security_context.established
        'on': {PASS: prepare-context, FAIL: failed, UNKNOWN: unresolved}
      prepare-context:
        call: ue.registration_context.prepare
        with: {ueRef: {from: input.ue-ref}, registrationType: {from: input.registration-type}}
        'on': {COMMITTED: verify-context, NOT_COMMITTED: failed, OUTCOME_UNKNOWN: safe-stopped, FAILED: failed, DENIED: failed}
      verify-context:
        verify: ue.registration_context.ready
        'on': {PASS: finalize-registration, FAIL: failed, UNKNOWN: unresolved}
      finalize-registration:
        call: ue.registration.finalize
        with: {ueRef: {from: input.ue-ref}, registrationType: {from: input.registration-type}}
        'on': {COMMITTED: verify-registration, NOT_COMMITTED: failed, OUTCOME_UNKNOWN: safe-stopped, FAILED: failed, DENIED: failed}
      verify-registration:
        verify: ue.registered
        'on': {PASS: verify-registration-context, FAIL: failed, UNKNOWN: unresolved}
      done: {terminal: SUCCEEDED}
      failed: {terminal: FAILED}
      unresolved: {terminal: UNRESOLVED}
      safe-stopped: {terminal: SAFE_STOPPED}
