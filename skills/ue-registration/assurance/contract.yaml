apiVersion: connectionagent.io/v1alpha1
kind: SkillContract
metadata:
  name: ue-registration
spec:
  skillType: executable
  goal: ue.ensure_registered
  entryProcedure: ensure-registration
  inputs:
    requestSchema: schemas/registration-request.schema.yaml
  allowedResources:
    capabilities:
    - ue.identity.resolve
    - ue.authentication.execute
    - ue.security.establish
    - ue.registration_context.prepare
    - ue.registration.finalize
    localTools: []
  postconditions:
  - predicate: ue.registered
    expect: PASS
  - predicate: ue.registration_context.consistent
    expect: PASS
  planning:
    maxActions: 8
    allowDynamicProcedure: false
