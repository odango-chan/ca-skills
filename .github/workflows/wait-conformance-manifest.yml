name: Wait Conformance Manifest

on:
  pull_request:
    paths:
      - "docs/design/wait-conformance-v1alpha5.json"
      - "docs/skill-language-spec.v1alpha5.zh-CN.md"
      - "scripts/validate_wait_conformance_manifest.py"
      - ".github/workflows/wait-conformance-manifest.yml"
  push:
    branches: [main]
    paths:
      - "docs/design/wait-conformance-v1alpha5.json"
      - "docs/skill-language-spec.v1alpha5.zh-CN.md"
      - "scripts/validate_wait_conformance_manifest.py"
      - ".github/workflows/wait-conformance-manifest.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Wait conformance obligation register
        run: python scripts/validate_wait_conformance_manifest.py
