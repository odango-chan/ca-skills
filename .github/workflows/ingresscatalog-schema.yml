name: IngressCatalog Schema

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/design/integration-ingress-operation-contract-vnext.zh-CN.md"
      - "docs/design/artifacts/ts-29.502-v19.5.0-nsmf-pdusession-openapi-source-lock.yaml"
      - "docs/design/schemas/ingresscatalog.v1alpha1.schema.json"
      - "docs/design/schemas/update-sm-context-response-result.v1.schema.json"
      - "docs/design/schemas/response-binary-content-reference.v1.schema.json"
      - "scripts/validate-ingresscatalog-example.py"
      - ".github/workflows/ingresscatalog-schema.yml"
  push:
    branches: [main]
    paths:
      - "docs/design/integration-ingress-operation-contract-vnext.zh-CN.md"
      - "docs/design/artifacts/ts-29.502-v19.5.0-nsmf-pdusession-openapi-source-lock.yaml"
      - "docs/design/schemas/ingresscatalog.v1alpha1.schema.json"
      - "docs/design/schemas/update-sm-context-response-result.v1.schema.json"
      - "docs/design/schemas/response-binary-content-reference.v1.schema.json"
      - "scripts/validate-ingresscatalog-example.py"
      - ".github/workflows/ingresscatalog-schema.yml"

permissions:
  contents: read

jobs:
  validate-ingresscatalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validators
        run: python -m pip install PyYAML jsonschema referencing
      - name: Probe official ETSI source download
        continue-on-error: true
        shell: bash
        run: |
          set -u
          base="https://www.etsi.org/deliver/etsi_ts/129500_129599/129502/19.05.00_60"
          pdf="$RUNNER_TEMP/ts_129502v190500p.pdf"
          zip="$RUNNER_TEMP/ts_129502v190500p0.zip"
          if curl --fail --location --retry 2 --silent --show-error --user-agent "Mozilla/5.0 (compatible; CA-Skill-Artifact-Lock/1.0)" "$base/ts_129502v190500p.pdf" --output "$pdf"; then
            wc -c "$pdf"
            sha256sum "$pdf"
          else
            echo "ETSI PDF download is blocked from this runner; no digest recorded."
          fi
          if curl --fail --location --retry 2 --silent --show-error --user-agent "Mozilla/5.0 (compatible; CA-Skill-Artifact-Lock/1.0)" "$base/ts_129502v190500p0.zip" --output "$zip"; then
            wc -c "$zip"
            sha256sum "$zip"
            unzip -l "$zip"
            mkdir -p "$RUNNER_TEMP/ts29502-p0"
            unzip -q "$zip" -d "$RUNNER_TEMP/ts29502-p0"
            find "$RUNNER_TEMP/ts29502-p0" -type f -print0 | sort -z | xargs -0 -r sha256sum
          else
            echo "ETSI p0 source package download is blocked from this runner; no digest recorded."
          fi
      - name: Probe informative 3GPP GitLab REL-19 source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/5G_APIs"
          git clone --quiet --depth 1 --branch REL-19 https://forge.3gpp.org/rep/all/5G_APIs.git "$repo"
          echo "REL-19 commit:"
          git -C "$repo" rev-parse HEAD
          echo "Nsmf_PDUSession OpenAPI source:"
          sha256sum "$repo/TS29502_Nsmf_PDUSession.yaml"
          grep -n -m 4 -E "version: '1.4.0'|3GPP TS 29.502 V19.5.0|title: 'Nsmf_PDUSession'" "$repo/TS29502_Nsmf_PDUSession.yaml"
      - name: Validate IngressCatalog example
        run: python scripts/validate-ingresscatalog-example.py
