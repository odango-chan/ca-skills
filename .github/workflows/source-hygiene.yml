name: Source Hygiene

on:
  push:
    branches: [main, feat/5gc-vnext-skill-migration]
  pull_request:
    branches: [main, design/capability-authoring-model-vnext]

permissions:
  contents: read

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify official Skill source hygiene
        run: make verify
