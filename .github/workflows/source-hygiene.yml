name: Source Hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify official Skill source hygiene
        run: make verify
      - name: Test MAS Compiler v2 project input gate
        run: python -m unittest discover -s tests -p test_compile_mas_v1alpha5.py
