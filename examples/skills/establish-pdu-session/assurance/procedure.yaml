# Illustrative CA-SL v1alpha4 deterministic DAG, NOT linked to qualified Owners.
# Runtime coordination (Hold/Claim/Waiter/Journal/Reconcile), invocation identity and lifecycle/correlation are Host/Owner internals.
# Skill decisions consume declared Operation Results/Evidence and explicit read-only
# Observations when a business decision requires current SMF-owned context. Non-SMF
# context required by an Operation stays inside its responsible Tool/Owner adapter.
# Host performs ingress admission, identity/instance association, duplicate suppression and execution lifecycle before this graph starts.
# This Skill validates only the business request profile; Host execution metadata is not a Procedure input.
start: read-existing-sm-context
nodes:
  # CA_EXTENSION — one exact UE/PSI lookup before any session-creating or session-mutating Operation.
  # 404 SESSION_NOT_FOUND is normalized to ABSENT; 200 AVAILABLE/UNAVAILABLE means PRESENT.
  # PRESENT is not an initial-creation path. Until an idempotent/recovery Owner contract
  # exists, stop rather than replaying UDM/PCF/N4 mutations. Query failure is not ABSENT.
  read-existing-sm-context:
    precondition:
      predicates:
        - predicate: establishment.request.supported
          arguments:
            - context.request.requestType
            - context.request.requestedPduSessionType
            - context.request.requestedSscMode
      routes:
        FAIL: FAILED
        UNKNOWN: UNRESOLVED
    observation:
      tool: ca::context.smf.session.read
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
      routes:
        FAILED: UNRESOLVED
        UNKNOWN: UNRESOLVED
    postcondition:
      predicates:
        - predicate: establishment.smf.session_context_absent
          arguments:
            - read-existing-sm-context.observation.output
      routes:
        PASS: get-sm-subscription-data
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # 3GPP: 3GPP_NATIVE — TS 23.502 V18.12.0 §4.3.2.2.1 step 4; SMF → UDM Nudm_SDM_Get.
  get-sm-subscription-data:
    operation:
      tool: ca::sbi.udm.sm_data.get
      arguments:
        ueRef: context.ueRef
        dnn: context.request.dnn
        sNssai: context.request.sNssai
        servingPlmn: context.request.servingPlmn
      routes:
        FAILED: SAFE_STOPPED
        UNKNOWN: UNRESOLVED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.udm.response_valid
          arguments:
            - get-sm-subscription-data.operation.output
        - predicate: establishment.subscription.request_valid
          arguments:
            - get-sm-subscription-data.operation.output
            - context.request.dnn
            - context.request.sNssai
            - context.request.requestedPduSessionType
            - context.request.requestedSscMode
      routes:
        PASS: subscribe-sm-data
        FAIL: FAILED
        UNKNOWN: UNRESOLVED

  # The Owner adapter resolves and claims the exact original UDM request internally.
  # 3GPP: 3GPP_NATIVE — TS 23.502 V18.12.0 §4.3.2.2.1 step 4; SMF → UDM Nudm_SDM_Subscribe.
  subscribe-sm-data:
    operation:
      tool: ca::sbi.udm.sdm_subscription.create
      arguments:
        ueRef: context.ueRef
        udmInvocationRef: get-sm-subscription-data.operation.output.invocationId
        udmTransactionRef: get-sm-subscription-data.operation.output.result.transactionRef
        udmReadResult: get-sm-subscription-data.operation.output.result
      routes:
        FAILED: ca-transfer-failed-resource-responsibility
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.udm.subscription_owned
          arguments:
            - subscribe-sm-data.operation.output
      routes:
        PASS: establish-sm-policy-association
        FAIL: ca-transfer-failed-resource-responsibility
        UNKNOWN: SAFE_STOPPED

  # The PCF Owner consumes the validated UDM read result and SDM subscription handle,
  # derives the Npcf request internally, and enforces exact hold, pre-N4 baseline,
  # lifecycle isolation and competing-create guards before dispatch.
  # 3GPP: 3GPP_NATIVE — TS 23.502 V18.12.0 §4.3.2.2.1 step 7b; Npcf_SMPolicyControl_Create / SM Policy Association Establishment.
  establish-sm-policy-association:
    operation:
      tool: ca::sbi.pcf.sm_policy.create
      arguments:
        ueRef: context.ueRef
        request: context.request
        udmReadResult: get-sm-subscription-data.operation.output.result
        sdmSubscriptionRef: subscribe-sm-data.operation.output.subscriptionRef
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.pcf.association_owned
          arguments:
            - establish-sm-policy-association.operation.output
      routes:
        PASS: establish-n4-session
        FAIL: ca-transfer-failed-resource-responsibility
        UNKNOWN: SAFE_STOPPED

  # The UPN Owner performs native SMF Step 8 selection (UPF/session-address and
  # effective session configuration) as part of N4 preparation, then owns the
  # N4 Session Establishment Request/Response. Step 8 is not a separate Skill Node.
  # 3GPP: CA_ADAPTER — TS 23.502 V18.12.0 §4.3.2.2.1 step 8 and steps 10a–10b; §4.4.1.2 N4 Session Establishment.
  establish-n4-session:
    operation:
      tool: upn::UPN.CREATE_UP_SESSION
      arguments:
        ueRef: context.ueRef
        request: context.request
        udmReadResult: get-sm-subscription-data.operation.output.result
        policyAssociationRef: establish-sm-policy-association.operation.output.policyAssociationRef
        policyResultRef: establish-sm-policy-association.operation.output.policyResultRef
      routes:
        FAILED: ca-transfer-failed-resource-responsibility
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.n4.initial_resources_ready
          arguments:
            - establish-n4-session.operation.output
      routes:
        PASS: transfer-n1n2-message
        FAIL: ca-transfer-failed-resource-responsibility
        UNKNOWN: SAFE_STOPPED

  # The N4 Owner result carries the effective Step 8 session configuration required
  # to construct N1/N2; no separate selection payload is passed by the Skill.
  # The Owner adapter internally resolves the exact N1/N2 request, prepares the response
  # artifact and payload, performs pre-dispatch checks, claims once and sends once.
  # 3GPP: 3GPP_NATIVE — TS 23.502 V18.12.0 §4.3.2.2.1 step 11; SMF → AMF Namf_Communication_N1N2MessageTransfer.
  transfer-n1n2-message:
    operation:
      tool: ca::sbi.amf.n1n2.transfer
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        request: context.request
        policyResultRef: establish-sm-policy-association.operation.output.policyResultRef
        initialN4Result: establish-n4-session.operation.output
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.amf.transfer_initiated
          arguments:
            - transfer-n1n2-message.operation.output
      routes:
        PASS: update-sm-context
        FAIL: ca-transfer-failed-resource-responsibility
        UNKNOWN: SAFE_STOPPED

  # Step 15 is a later inbound Nsmf_PDUSession_UpdateSMContext Request, not a new
  # Skill invocation. Host admits it and correlates it to this pending Operation;
  # the Owner completes the exact asynchronous Operation and Runtime resumes this
  # same Invocation here. Host keeps the paired Step 17 response obligation private.
  # AMF/(R)AN/UE perform steps 12–14; SSM is the CA adapter for the SMF-side result.
  # 3GPP: CA_ADAPTER — TS 23.502 V18.12.0 §4.3.2.2.1 step 15; Nsmf_PDUSession_UpdateSMContext Request (SSM is an internal CA callable, not a standard API).
  update-sm-context:
    operation:
      tool: ssm::SSM.SIGNAL_UE_AN
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        transferOperationRef: transfer-n1n2-message.operation.output.operationRef
        initialN4Result: establish-n4-session.operation.output
      routes:
        FAILED: ca-transfer-failed-resource-responsibility
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.ran.adopted
          arguments:
            - update-sm-context.operation.output
      routes:
        PASS: read-smf-session-context
        FAIL: ca-transfer-failed-resource-responsibility
        UNKNOWN: SAFE_STOPPED

  # Re-read the exact UE/PSI after the Step 15 continuation for the current
  # SMF-owned facts needed by the N4 decision. Presence and projection availability
  # are checked again; this is a synchronous READ, not callback polling.
  # The callable is a generic CA context interface; its compatibility backend is
  # deliberately not exposed in this conventional Skill.
  # 3GPP: CA_EXTENSION — current SMF session-context read supporting steps 16a–16b.
  read-smf-session-context:
    observation:
      tool: ca::context.smf.session.read
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
      routes:
        FAILED: UNRESOLVED
        UNKNOWN: UNRESOLVED
    postcondition:
      predicates:
        - predicate: establishment.smf.session_context_profile_ready
          arguments:
            - read-smf-session-context.observation.output
            - context.request.dnn
            - context.request.sNssai.sst
      routes:
        PASS: modify-n4-session
        FAIL: ca-transfer-failed-resource-responsibility
        UNKNOWN: SAFE_STOPPED

  # 3GPP: CA_ADAPTER — TS 23.502 V18.12.0 §4.3.2.2.1 steps 16a–16b and §4.4.1.3; N4 Session Modification Request/Response.
  modify-n4-session:
    operation:
      tool: upn::UPN.MODIFY_UP_SESSION
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        initialN4Result: establish-n4-session.operation.output
        ranResult: update-sm-context.operation.output
      routes:
        FAILED: ca-transfer-failed-resource-responsibility
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.n4.forwarding_ready
          arguments:
            - modify-n4-session.operation.output
      routes:
        PASS: ca-transfer-resource-responsibility
        FAIL: ca-transfer-failed-resource-responsibility
        UNKNOWN: SAFE_STOPPED

  # 3GPP: CA_EXTENSION — CA resource-lifecycle handoff; no direct 3GPP procedure counterpart.
  ca-transfer-resource-responsibility:
    operation:
      tool: ca::ca.session.resource_responsibility.transfer
      arguments:
        disposition: "success"
      routes:
        SUCCEEDED: verify-pdu-session-establishment
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED

  # 3GPP: CA_EXTENSION — CA failure/resource-responsibility handoff; no direct 3GPP procedure counterpart.
  ca-transfer-failed-resource-responsibility:
    # Only reached from definitive business FAIL/FAILED with a confirmed original Mutation outcome.
    # OUTCOME_UNKNOWN must directly SAFE_STOP; no cleanup/retry follows uncertain commitment.
    operation:
      tool: ca::ca.session.resource_responsibility.transfer
      arguments:
        disposition: "failed"
      routes:
        SUCCEEDED: FAILED
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED

  # 3GPP: CA_EXTENSION — final Goal proof over authoritative 3GPP session facts and CA responsibility Evidence.
  verify-pdu-session-establishment:
    postcondition:
      predicates:
        - predicate: establishment.ran.adopted
          arguments:
            - update-sm-context.operation.output
        - predicate: establishment.n4.forwarding_ready
          arguments:
            - modify-n4-session.operation.output
        - predicate: establishment.n4.initial_resources_ready
          arguments:
            - establish-n4-session.operation.output
        - predicate: establishment.resources.managed
          arguments:
            - ca-transfer-resource-responsibility.operation.output
      routes:
        PASS: SUCCEEDED
        FAIL: SAFE_STOPPED
        UNKNOWN: UNRESOLVED
