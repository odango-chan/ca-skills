# Illustrative CA-SL v1alpha4 deterministic DAG, NOT linked to qualified Owners.
# A missing Owner output / Evidence guarantee MUST block compilation, not be guessed.
start: check-request
nodes:
  check-request:
    precondition:
      predicates:
        - predicate: establishment.request.supported
          arguments:
            - context.request.requestType
            - context.request.requestedPduSessionType
            - context.request.requestedSscMode
        - predicate: establishment.ingress.eligible
          arguments:
            - context.ingress
        - predicate: establishment.lifecycle.ready
          arguments:
            - context.lifecycle
      routes:
        PASS: read-udm
        FAIL: FAILED
        UNKNOWN: UNRESOLVED
  read-udm:
    operation:
      tool: ca::sbi.udm.sm_data.get
      arguments:
        ueRef: context.ueRef
        dnn: context.request.dnn
        sNssai: context.request.sNssai
        servingPlmn: context.request.servingPlmn
      routes:
        FAILED: SAFE_STOPPED
        UNKNOWN: UNRESOLVED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.udm.response_valid
          arguments:
            - read-udm.operation.output
      routes:
        PASS: select-establishment-configuration
        FAIL: FAILED
        UNKNOWN: UNRESOLVED
  select-establishment-configuration:
    # Pure selection does not mint evidence or authorize Subscription data.
    operation:
      script: scripts/select-establishment-configuration.py
      arguments:
        dnn: context.request.dnn
        sNssai: context.request.sNssai
        requestedPduSessionType: context.request.requestedPduSessionType
        requestedSscMode: context.request.requestedSscMode
        udmResult: read-udm.operation.output.result
      routes:
        SUCCEEDED: bind-udm-hold
        FAILED: FAILED
  bind-udm-hold:
    operation:
      tool: ca::ca.session.udm_hold.bind
      arguments:
        ueRef: context.ueRef
        dnn: context.request.dnn
        snssai: context.request.sNssai
        ingressRef: context.correlation.ingressRef
        lifecycleRef: context.correlation.lifecycleRef
      routes:
        SUCCEEDED: subscribe-udm
        FAILED: SAFE_STOPPED
        UNKNOWN: UNRESOLVED
        DENIED: SAFE_STOPPED
  subscribe-udm:
    precondition:
      predicates:
        - predicate: establishment.udm.hold_bound
          arguments:
            - bind-udm-hold.operation.output
            - context.request.dnn
            - context.request.sNssai.sst
      routes:
        FAIL: SAFE_STOPPED
        UNKNOWN: UNRESOLVED
    operation:
      tool: ca::sbi.udm.sdm_subscription.create
      arguments:
        ueRef: context.ueRef
        udmInvocationRef: read-udm.operation.output.invocationId
        udmTransactionRef: read-udm.operation.output.result.transactionRef
        selection: select-establishment-configuration.operation.output
        ingressRef: context.correlation.ingressRef
        lifecycleRef: context.correlation.lifecycleRef
        waiterRef: bind-udm-hold.operation.output.holdRef
      routes:
        FAILED: finalize-failed
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.udm.subscription_owned
          arguments:
            - subscribe-udm.operation.output
      routes:
        PASS: bind-pcf-hold
        FAIL: finalize-failed
        UNKNOWN: SAFE_STOPPED
  bind-pcf-hold:
    operation:
      tool: ca::ca.session.pcf_hold.bind
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        ingressRef: context.correlation.ingressRef
        lifecycleRef: context.correlation.lifecycleRef
      routes:
        FAILED: finalize-failed
        UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.pcf.hold_bound
          arguments:
            - bind-pcf-hold.operation.output
            - context.correlation.lifecycleRef
      routes:
        PASS: read-pcf-inputs
        FAIL: finalize-failed
        UNKNOWN: SAFE_STOPPED
  read-pcf-inputs:
    operation:
      tool: ca::ca.session.pcf_create_inputs.read
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        requestType: context.request.requestType
        ingressRef: context.correlation.ingressRef
        lifecycleRef: context.correlation.lifecycleRef
        fabricHoldRef: bind-pcf-hold.operation.output.holdRef
        selection: select-establishment-configuration.operation.output
      routes:
        FAILED: finalize-failed
        UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.pcf.create_inputs.ready
          arguments:
            - read-pcf-inputs.operation.output
            - bind-pcf-hold.operation.output
      routes:
        PASS: build-pcf-policy-inputs
        FAIL: finalize-failed
        UNKNOWN: SAFE_STOPPED
  build-pcf-policy-inputs:
    operation:
      script: scripts/build-pcf-policy-inputs.py
      arguments:
        subscriptionData: select-establishment-configuration.operation.output.subscriptionData
        subscriptionSource: select-establishment-configuration.operation.output.subscriptionSource
      routes:
        SUCCEEDED: create-pcf
        FAILED: FAILED
  create-pcf:
    # The old 5GC baseline requires both PCF create governance and a proven
    # PRE-N4 no-pair baseline. Those Owner/Evidence guarantees are not published
    # in v1alpha4 yet: linker must fail closed rather than skip this gate.
    precondition:
      predicates:
        - predicate: establishment.pcf.create_governed
          arguments:
            - read-pcf-inputs.operation.output
            - context.correlation.lifecycleRef
      routes:
        FAIL: SAFE_STOPPED
        UNKNOWN: UNRESOLVED
    operation:
      tool: ca::sbi.pcf.sm_policy.create
      arguments:
        ueRef: context.ueRef
        pcfCreateInputsRef: read-pcf-inputs.operation.output.pcfCreateInputsRef
        selection: select-establishment-configuration.operation.output
        policyInputs: build-pcf-policy-inputs.operation.output
        lifecycleRef: context.correlation.lifecycleRef
        sdmSubscriptionRef: subscribe-udm.operation.output.subscriptionRef
        waiterRef: bind-pcf-hold.operation.output.holdRef
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    # PCF policy association is NOT N4 establishment. Do not infer an N4
    # completion state from the SBI create reply or its waiter/hold reference.
    postcondition:
      predicates:
        - predicate: establishment.pcf.association_owned
          arguments:
            - create-pcf.operation.output
            - read-pcf-inputs.operation.output
      routes:
        PASS: create-initial-n4
        FAIL: finalize-failed
        UNKNOWN: SAFE_STOPPED
  create-initial-n4:
    # §21 target design only: real UPN Owner/Schema/Evidence MUST be published.
    # Completes the actual N4 CREATE operation internally; no Skill wait loop.
    operation:
      tool: upn::UPN.CREATE_UP_SESSION
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        lifecycleRef: context.correlation.lifecycleRef
        policyAssociationRef: read-pcf-inputs.operation.output.pcfPolicyAssociationRef
        policyResultRef: create-pcf.operation.output.policyResultRef
      routes:
        FAILED: finalize-failed
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.n4.initial_resources_ready
          arguments:
            - create-initial-n4.operation.output
      routes:
        PASS: read-operation-context
        FAIL: finalize-failed
        UNKNOWN: SAFE_STOPPED
  read-operation-context:
    operation:
      tool: ca::ca.session.operation_context.read
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        requestType: context.request.requestType
        ingressRef: context.correlation.ingressRef
        lifecycleRef: context.correlation.lifecycleRef
        selection: select-establishment-configuration.operation.output
        policyResultRef: create-pcf.operation.output.policyResultRef
        purpose: "nas-and-n2-delivery"
      routes:
        FAILED: finalize-failed
        UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.delivery_context.ready
          arguments:
            - read-operation-context.operation.output
            - context.correlation.lifecycleRef
      routes:
        PASS: prepare-response
        FAIL: finalize-failed
        UNKNOWN: SAFE_STOPPED
  prepare-response:
    operation:
      tool: ca::ca.session.establishment_response.prepare
      arguments:
        operationContextRef: read-operation-context.operation.output.contextRef
        runtimeInvocationRef: read-operation-context.operation.output.runtimeInvocationRef
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        lifecycleRef: context.correlation.lifecycleRef
        selection: select-establishment-configuration.operation.output
        policyResultRef: create-pcf.operation.output.policyResultRef
      routes:
        SUCCEEDED: build-n1n2-delivery
        FAILED: SAFE_STOPPED
        UNKNOWN: UNRESOLVED
        DENIED: SAFE_STOPPED
  build-n1n2-delivery:
    operation:
      script: scripts/build-n1n2-delivery.py
      arguments:
        preparedResponse: prepare-response.operation.output
        operationContextRef: read-operation-context.operation.output.contextRef
        policyResultRef: create-pcf.operation.output.policyResultRef
        pduSessionType: select-establishment-configuration.operation.output.pduSessionType
      routes:
        SUCCEEDED: bind-n1n2-hold
        FAILED: FAILED
  bind-n1n2-hold:
    operation:
      tool: ca::ca.session.n1n2_hold.bind
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        ingressRef: context.correlation.ingressRef
        lifecycleRef: context.correlation.lifecycleRef
      routes:
        SUCCEEDED: transfer-n1n2
        FAILED: SAFE_STOPPED
        UNKNOWN: UNRESOLVED
        DENIED: SAFE_STOPPED
  transfer-n1n2:
    precondition:
      predicates:
        - predicate: establishment.n1n2.hold_bound
          arguments:
            - bind-n1n2-hold.operation.output
            - context.correlation.lifecycleRef
      routes:
        FAIL: SAFE_STOPPED
        UNKNOWN: UNRESOLVED
    operation:
      tool: ca::sbi.amf.n1n2.transfer
      arguments:
        operationContextRef: read-operation-context.operation.output.contextRef
        runtimeInvocationRef: read-operation-context.operation.output.runtimeInvocationRef
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        lifecycleRef: context.correlation.lifecycleRef
        responseArtifactRef: prepare-response.operation.output.responseArtifactRef
        waiterRef: bind-n1n2-hold.operation.output.holdRef
        delivery: build-n1n2-delivery.operation.output
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    # AMF N1N2 delivery only proves transfer initiation, never RAN adoption.
    postcondition:
      predicates:
        - predicate: establishment.amf.transfer_initiated
          arguments:
            - transfer-n1n2.operation.output
      routes:
        PASS: signal-ran
        FAIL: finalize-failed
        UNKNOWN: SAFE_STOPPED
  signal-ran:
    # §21 SSM Owner executes RAN signaling/adoption to completion.
    operation:
      tool: ssm::SSM.SIGNAL_UE_AN
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        ingressRef: context.correlation.ingressRef
        lifecycleRef: context.correlation.lifecycleRef
        operationContextRef: read-operation-context.operation.output.contextRef
        transferOperationRef: transfer-n1n2.operation.output.operationRef
        initialN4Result: create-initial-n4.operation.output
      routes:
        FAILED: finalize-failed
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.ran.adopted
          arguments:
            - signal-ran.operation.output
      routes:
        PASS: modify-forwarding
        FAIL: finalize-failed
        UNKNOWN: SAFE_STOPPED
  modify-forwarding:
    # §21 UPN Owner executes N4 forwarding mutation to completion.
    operation:
      tool: upn::UPN.MODIFY_UP_SESSION
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        lifecycleRef: context.correlation.lifecycleRef
        initialN4Result: create-initial-n4.operation.output
        ranResult: signal-ran.operation.output
      routes:
        FAILED: finalize-failed
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.n4.forwarding_ready
          arguments:
            - modify-forwarding.operation.output
      routes:
        PASS: transfer-responsibility
        FAIL: finalize-failed
        UNKNOWN: SAFE_STOPPED
  transfer-responsibility:
    operation:
      tool: ca::ca.session.resource_responsibility.transfer
      arguments:
        lifecycleRef: context.correlation.lifecycleRef
        disposition: "success"
      routes:
        SUCCEEDED: verify-final
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
  finalize-failed:
    # Only reached from definitive business FAIL/FAILED with a confirmed
    # original Mutation outcome. OUTCOME_UNKNOWN must directly SAFE_STOP.
    # Requires separately trusted responsibility-Owner/Scope grant.
    operation:
      tool: ca::ca.session.resource_responsibility.transfer
      arguments:
        lifecycleRef: context.correlation.lifecycleRef
        disposition: "failed"
      routes:
        SUCCEEDED: FAILED
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
  verify-final:
    postcondition:
      predicates:
        - predicate: establishment.ran.adopted
          arguments:
            - signal-ran.operation.output
        - predicate: establishment.n4.forwarding_ready
          arguments:
            - modify-forwarding.operation.output
        - predicate: establishment.n4.initial_resources_ready
          arguments:
            - create-initial-n4.operation.output
        - predicate: establishment.resources.managed
          arguments:
            - transfer-responsibility.operation.output
      routes:
        PASS: SUCCEEDED
        FAIL: SAFE_STOPPED
        UNKNOWN: UNRESOLVED
