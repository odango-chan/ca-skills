# CA-SL v1alpha4 ordered Predicate signatures. All ca::urn:example Schema IDs
# and ca:: guarantees below are UNPUBLISHED until their actual Owner releases them.
# Linking must fail closed; matching old v0.2 names does not grant provenance.
predicates:
  establishment.request.supported:
    parameters:
      - requestType: integer
      - pduType: string
      - sscMode: integer
    evaluator:
      type: cel
      expression: requestType == 1 && pduType == "IPV4" && sscMode == 1

  # Restored v0.2 ingress/lifecycle admission, now explicit global members.
  # The context projection is UNPUBLISHED and must be linked before use.
  establishment.ingress.eligible:
    parameters:
      - ingress: ca::urn:example:5gc:admitted-ingress:v1
    evidence:
      requires:
        ingress: [ca::ingress.admission-current]
    evaluator:
      type: cel
      expression: >-
        ingress.messageType == 193 &&
        ingress.bindingStatus == "CURRENT" &&
        ingress.actionAuthorized == true &&
        ingress.requestType == 1 &&
        ingress.pti > 0

  establishment.lifecycle.ready:
    parameters:
      - lifecycle: ca::urn:example:5gc:lifecycle-registration:v1
    evidence:
      requires:
        lifecycle: [ca::lifecycle.registration-current]
    evaluator:
      type: cel
      expression: >-
        lifecycle.lifecycleRef != "" &&
        lifecycle.registrationState == "DURABLE" &&
        lifecycle.receiverState == "READY" &&
        lifecycle.lateResultResponsibility == "RETAINED"

  establishment.udm.subscription_owned:
    parameters:
      - subscription: ca::urn:example:5gc:udm-subscription-resource:v1
    evidence:
      requires:
        subscription: [ca::udm.subscription-owned]
    evaluator:
      type: cel
      expression: >-
        subscription.creationState == "CREATED" &&
        subscription.ownership == "AGENT" &&
        subscription.managementState == "DURABLE"

  establishment.pcf.hold_bound:
    parameters:
      - hold: ca::urn:example:5gc:pcf-hold-state:v1
      - lifecycleRef: string
    evidence:
      requires:
        hold: [ca::pcf.hold-bound]
    evaluator:
      type: cel
      expression: >-
        hold.bindingStatus == "CURRENT" &&
        hold.operationKind == "PCF_SM_POLICY_CREATE" &&
        hold.holdRef != "" &&
        hold.currentInstanceRef != "" &&
        hold.heldRequestDigest != "" &&
        hold.policyAssociationRef != "" &&
        hold.lifecycleRef == lifecycleRef

  establishment.pcf.create_inputs.ready:
    parameters:
      - inputs: ca::urn:example:5gc:pcf-create-inputs:v1
      - hold: ca::urn:example:5gc:pcf-hold-state:v1
    evidence:
      requires:
        inputs: [ca::pcf.create-inputs-current]
        hold: [ca::pcf.hold-bound]
    evaluator:
      type: cel
      expression: >-
        inputs.bindingStatus == "CURRENT" &&
        inputs.pcfCreateInputsRef != "" &&
        inputs.pcfPolicyAssociationRef != "" &&
        inputs.fabricHoldRef == hold.holdRef &&
        inputs.allocatedIPv4 != "" &&
        inputs.selectionDigest != ""

  establishment.pcf.association_owned:
    parameters:
      - association: ca::urn:example:5gc:pcf-association-resource:v1
      - inputs: ca::urn:example:5gc:pcf-create-inputs:v1
    evidence:
      requires:
        association: [ca::pcf.association-owned]
        inputs: [ca::pcf.create-inputs-current]
    evaluator:
      type: cel
      expression: >-
        association.creationState == "CREATED" &&
        association.ownership == "AGENT" &&
        association.managementState == "DURABLE" &&
        association.policyAssociationRef == inputs.pcfPolicyAssociationRef

  establishment.delivery_context.ready:
    parameters:
      - delivery: ca::urn:example:5gc:nas-delivery-context:v1
      - lifecycleRef: string
    evidence:
      requires:
        delivery: [ca::amf.delivery-context-current]
    evaluator:
      type: cel
      expression: >-
        delivery.bindingStatus == "CURRENT" &&
        delivery.addressAllocated == true &&
        delivery.nasInputsComplete == true &&
        delivery.delegatedCallerAuthorized == true &&
        delivery.lifecycleRef == lifecycleRef

  establishment.amf.transfer_initiated:
    parameters:
      - response: ca::urn:example:5gc:amf-transfer-initiation:v1
    evidence:
      requires:
        response: [ca::amf.transfer-initiated]
    evaluator:
      type: cel
      # This confirms initiation ONLY; never proves RAN adoption/N4 state.
      # Owner MUST provide a 3-state classification for 202/buffered/ambiguous
      # responses before this predicate can link as production admission.
      expression: >-
        response.networkOutcome == "HTTP_RESPONSE" &&
        response.responseOrigin == "TARGET_SERVICE_VIA_SCP" &&
        response.captureComplete == true &&
        response.httpStatus == 200 &&
        response.cause == "N1_N2_TRANSFER_INITIATED"

  establishment.udm.response_valid:
    parameters:
      - receipt: ca::urn:example:5gc:udm-read-receipt:v1
    evidence:
      requires:
        receipt: [ca::udm.subscription-state]
    evaluator:
      type: cel
      expression: >-
        receipt.result.selection == "MATCHED" &&
        receipt.result.httpStatus == 200 &&
        receipt.result.networkOutcome == "HTTP_RESPONSE" &&
        receipt.result.responseOrigin == "TARGET_SERVICE_VIA_SCP" &&
        receipt.result.captureComplete == true

  establishment.udm.hold_bound:
    parameters:
      - hold: ca::urn:example:5gc:udm-hold-state:v1
      - dnn: string
      - sst: integer
    evidence:
      requires:
        hold: [ca::udm.hold-bound]
    evaluator:
      type: cel
      expression: >-
        hold.bindingStatus == "CURRENT" &&
        hold.operationKind == "UDM_SDM_SUBSCRIPTION_CREATE" &&
        hold.deadline != "" &&
        hold.holdRef != "" && hold.currentInstanceRef != "" &&
        hold.heldRequestDigest != "" && hold.dnn == dnn && hold.sst == sst

  establishment.pcf.create_governed:
    parameters:
      - readiness: ca::urn:example:5gc:pcf-create-governance:v1
      - lifecycleRef: string
    evidence:
      requires:
        readiness: [ca::pcf.create-governance, ca::n4.baseline-clear]
    evaluator:
      type: cel
      expression: >-
        readiness.lifecycleIsolationState == "CLEAN" &&
        readiness.competingCreateState == "NOT_FORWARDED" &&
        readiness.preN4PairState == "NO_N4_PAIR" &&
        readiness.lifecycleRef == lifecycleRef

  establishment.n4.initial_resources_ready:
    parameters:
      - resources: ca::urn:example:5gc:n4-initial-resources:v1
    evidence:
      requires:
        resources: [ca::n4.initial-resources-ready]
    evaluator:
      type: cel
      expression: >-
        resources.bindingStatus == "CURRENT" &&
        resources.defaultFlowInstalled == true &&
        resources.uplinkEndpointBound == true

  establishment.n1n2.hold_bound:
    parameters:
      - hold: ca::urn:example:5gc:n1n2-hold-state:v1
      - lifecycleRef: string
    evidence:
      requires:
        hold: [ca::amf.n1n2-hold-bound]
    evaluator:
      type: cel
      expression: >-
        hold.bindingStatus == "CURRENT" &&
        hold.operationKind == "N1N2_MESSAGE_TRANSFER" &&
        hold.deadline != "" &&
        hold.holdRef != "" && hold.currentInstanceRef != "" &&
        hold.heldRequestDigest != "" && hold.targetNfInstanceId != "" &&
        hold.supi != "" && hold.lifecycleRef == lifecycleRef

  establishment.ran.adopted:
    parameters:
      - network: ca::urn:example:5gc:ran-adoption:v1
    evidence:
      requires:
        network: [ca::ran.setup-adopted]
    evaluator:
      type: cel
      expression: >-
        network.result == "ACCEPTED" &&
        network.requiredFlowMatched == true &&
        network.currentInstanceBound == true &&
        network.baselineRanEndpointPresent == false

  establishment.n4.forwarding_ready:
    parameters:
      - network: ca::urn:example:5gc:n4-forwarding:v1
    evidence:
      requires:
        network: [ca::n4.forwarding-ready]
    evaluator:
      type: cel
      expression: >-
        network.bindingStatus == "CURRENT" &&
        network.requiredFlowMatched == true &&
        network.downlinkTunnelMatched == true &&
        network.gatesAllowForwarding == true

  establishment.resources.managed:
    parameters:
      - responsibility: ca::urn:example:5gc:resource-responsibility:v1
    evidence:
      requires:
        responsibility: [ca::resources.durably-managed]
    evaluator:
      type: cel
      expression: >-
        responsibility.managementState == "ACCEPTED" &&
        responsibility.allResourcesCovered == true &&
        responsibility.pendingResponsibilitiesRetained == true
