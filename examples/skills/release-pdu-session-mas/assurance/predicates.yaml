# Candidate predicates. Their Schema and Evidence references are placeholders
# until the MAS Owner publishes trusted ToolCatalog contracts.
predicates:
  release.request.supported:
    parameters:
      - trigger: integer
    evaluator:
      type: cel
      expression: trigger >= 1 && trigger <= 7

  release.mas.up_session_deleted:
    parameters:
      - result: mas::wtlab:openamsm:mas:v0.2.0:upn-delete-up-session-result
    evidence:
      requires:
        result: [mas::upn.up-session-deleted]
    evaluator:
      type: cel
      expression: result.released == "1"

  release.mas.sm_context_release_committed:
    parameters:
      - result: mas::wtlab:openamsm:mas:v0.2.0:sc-release-sm-context-result
    evidence:
      requires:
        result: [mas::sc.context-release-committed]
    evaluator:
      type: cel
      expression: result.lifecycle == "RELEASING"
