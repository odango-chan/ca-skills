# No Release Owner Evidence Guarantees are published in the current
# ca-client-tools candidate. Do not invent guarantee IDs or proofs.
predicates:
  release.request.supported:
    parameters:
      - trigger: integer
    evaluator:
      type: cel
      expression: trigger >= 1 && trigger <= 7

  # Owner must publish the exact released output Schema and Guarantee before link.
  release.mas.up_session_deleted:
    parameters:
      - released: string
    evaluator:
      type: cel
      expression: released == "1"

  # Owner must publish the exact lifecycle output Schema and Guarantee before link.
  release.mas.sm_context_release_committed:
    parameters:
      - lifecycle: string
    evaluator:
      type: cel
      expression: lifecycle == "RELEASING"
