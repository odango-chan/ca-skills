# Candidate predicates. New Release Owner schemas/guarantees are not published yet.
predicates:
  release.request.supported:
    parameters:
      - trigger: integer
    evaluator:
      type: cel
      expression: trigger >= 1 && trigger <= 7

  release.mas.up_session_deleted:
    parameters:
      - released: string
    evidence:
      requires:
        released: [mas::upn.up-session-deleted]
    evaluator:
      type: cel
      expression: released == "1"

  release.mas.sm_context_release_committed:
    parameters:
      - lifecycle: string
    evidence:
      requires:
        lifecycle: [mas::sc.context-release-committed]
    evaluator:
      type: cel
      expression: lifecycle == "RELEASING"
