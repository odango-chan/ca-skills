# CA-SL v1alpha5 PredicateSet.
# Every MAS Schema and Evidence Guarantee below is an unpublished Owner candidate.
predicates:
  release.request.admitted:
    parameters:
      - supi: string
      - pduSessionId: integer
      - entryKind: string
      - n1Sm: string
      - releaseTxn: string
    evaluator:
      type: cel
      expression: >-
        supi != "" &&
        pduSessionId >= 1 &&
        pduSessionId <= 15 &&
        entryKind == "UE_INITIATED" &&
        n1Sm != "" &&
        releaseTxn != ""

  release.mas.release_parsed:
    parameters:
      - result: mas::wtlab:openamsm:mas:v0.4.0:ssm-parse-n1-release-result
    evidence:
      requires:
        result: [mas::ssm.n1-release-parsed]
    evaluator:
      type: cel
      expression: >-
        result.release_intent == "ue_requested" &&
        result.psi != "" &&
        result.pti != ""

  release.mas.command_built:
    parameters:
      - result: mas::wtlab:openamsm:mas:v0.4.0:ssm-build-release-command-result
    evidence:
      requires:
        result: [mas::ssm.release-command-built]
    evaluator:
      type: cel
      expression: >-
        result.release_phase == "command_built" &&
        result.n1_sm_hex != "" &&
        result.n2_sm_hex != "" &&
        result.n2_sm_info_type == "PDU_RES_REL_CMD" &&
        result.release_txn != "" &&
        result.release_generation != ""

  release.mas.n1_confirmed:
    parameters:
      - result: mas::wtlab:openamsm:mas:v0.4.0:ssm-release-confirm-n1-result
    evidence:
      requires:
        result: [mas::ssm.release-n1-confirmed]
    evaluator:
      type: cel
      expression: result.n1_released == "1"

  # The Owner reports release_ready=1 only after both the N1 Release Complete
  # and the N2 Release Response were accepted for the exact generation.
  release.mas.release_ready:
    parameters:
      - result: mas::wtlab:openamsm:mas:v0.4.0:ssm-release-confirm-n2-result
    evidence:
      requires:
        result: [mas::ssm.release-n2-confirmed]
    evaluator:
      type: cel
      expression: >-
        result.n2_released == "1" &&
        result.release_ready == "1"

  release.mas.policy_association_released:
    parameters:
      - result: mas::wtlab:openamsm:mas:v0.4.0:pa-delete-sm-policy-result
    evidence:
      requires:
        result: [mas::pa.policy-association-released]
    evaluator:
      type: cel
      expression: result.terminated == "1"

  release.mas.up_session_deleted:
    parameters:
      - result: mas::wtlab:openamsm:mas:v0.3.0:upn-delete-up-session-result
    evidence:
      requires:
        result: [mas::upn.up-session-released]
    evaluator:
      type: cel
      expression: result.released == "1"

  # The Owner writes only a local release event marker; Evidence must not imply
  # durable external delivery.
  release.mas.release_event_recorded:
    parameters:
      - result: mas::wtlab:openamsm:mas:v0.3.0:se-emit-release-event-result
    evidence:
      requires:
        result: [mas::se.release-event-marker-written]
    evaluator:
      type: cel
      expression: size(result) == 0

  release.mas.sm_context_release_progressed:
    parameters:
      - result: mas::wtlab:openamsm:mas:v0.4.0:sc-release-sm-context-result
    evidence:
      requires:
        result: [mas::sc.context-release-committed]
    evaluator:
      type: cel
      expression: result.lifecycle == "RELEASING"

