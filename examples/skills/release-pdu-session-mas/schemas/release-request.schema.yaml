$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:connectionagent:example:mas:release-request:v1alpha5
title: ReleaseRequest
description: Host-classified Open5GS PFCP delete trigger and existing PDU Session identity.
type: object
additionalProperties: false
required: [trigger, pduSessionId]
properties:
  trigger:
    type: integer
    enum: [1, 2, 3, 4, 5, 6, 7]
    description: >-
      Pinned Open5GS OGS_PFCP_DELETE_TRIGGER value: 1 LOCAL_INITIATED; 2 UE_REQUESTED;
      3 PCF_INITIATED; 4 RAN_INITIATED; 5 SMF_INITIATED;
      6 AMF_RELEASE_SM_CONTEXT; 7 AMF_UPDATE_SM_CONTEXT.
  pduSessionId:
    type: integer
    minimum: 1
    maximum: 15
    description: 3GPP PDU Session ID of the existing Session selected by the Host
