$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:connectionagent:example:mas:release-request:v1alpha5
title: ReleaseRequest
description: Host-normalized UE release entry, the exact retained N1 and the Host-private release transaction id.
type: object
additionalProperties: false
required: [pduSessionId, entryKind, trigger, n1Sm, releaseTxn]
properties:
  pduSessionId:
    type: integer
    minimum: 1
    maximum: 15
  entryKind:
    type: string
    enum: [UE_INITIATED]
  trigger:
    type: integer
    enum: [1, 2, 3, 4, 5, 6, 7]
  # The exact 5GSM PDU Session Release Request (0xd1) as lowercase hex.
  n1Sm:
    type: string
    minLength: 8
    maxLength: 1024
  # Host-private transaction identity for this Release Run. It is never taken
  # from the AMF JSON body.
  releaseTxn:
    type: string
    minLength: 1
    maxLength: 127
