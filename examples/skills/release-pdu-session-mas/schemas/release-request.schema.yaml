$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:connectionagent:example:mas:release-request:v1alpha5
title: ReleaseRequest
description: Host-normalized entry envelope for an already admitted PDU Session release.
type: object
additionalProperties: false
required: [pduSessionId, entryKind, trigger]
properties:
  pduSessionId: {type: integer, minimum: 1, maximum: 15}
  entryKind:
    type: string
    enum: [UE_INITIATED, AMF_INITIATED, NETWORK_TRIGGERED]
    description: Host-classified ingress variant; not a caller-controlled authorization claim.
  trigger:
    type: string
    enum:
      - UE_REQUESTED
      - AMF_UPDATE_SM_CONTEXT
      - AMF_RELEASE_SM_CONTEXT
      - PCF_INITIATED
      - SMF_INITIATED
      - LOCAL_INITIATED
    description: Symbolic Host-normalized trigger; Owner maps it to the pinned source enum before OES dispatch.
