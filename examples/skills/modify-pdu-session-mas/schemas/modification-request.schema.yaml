$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:connectionagent:example:mas:modification-request:v1alpha5
title: ModificationRequest
description: Host-classified trigger for a new modification of an existing PDU Session.
type: object
additionalProperties: false
required: [trigger, pduSessionId]
properties:
  trigger:
    type: string
    enum: [UE_REQUESTED, AMF_RAN_REQUESTED, NETWORK_TRIGGERED]
  pduSessionId:
    type: integer
    minimum: 1
    maximum: 15
    description: 3GPP PDU Session ID of the existing Session selected by the Host
