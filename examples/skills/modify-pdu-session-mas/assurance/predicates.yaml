# Candidate predicates. The exact Owner schemas/guarantees are not published yet.
# Existing s10/s11 candidate outputs are referenced by their source-derived Schema IDs;
# m0 and the first m3 occurrence need new Owner output contracts.
predicates:
  modify.request.supported:
    parameters:
      - trigger: string
    evaluator:
      type: cel
      expression: trigger == "UE_REQUESTED" || trigger == "AMF_RAN_REQUESTED" || trigger == "NETWORK_TRIGGERED"

  modify.mas.context_updated:
    parameters:
      - lifecycle: string
    evidence:
      requires:
        lifecycle: [mas::sc.context-updated]
    evaluator:
      type: cel
      expression: lifecycle == "OPERATIONAL"

  modify.mas.n4_modification_prepared:
    parameters:
      - n4Seid: string
    evidence:
      requires:
        n4Seid: [mas::upn.n4-modification-prepared]
    evaluator:
      type: cel
      expression: n4Seid != "" && n4Seid != "0"

  modify.mas.access_network_result_available:
    parameters:
      - result: mas::urn:example:openamsm:mas:ssm-signal-ue-an-result:v1
    evidence:
      requires:
        result: [mas::ssm.access-network-ready]
    evaluator:
      type: cel
      expression: result.an_tunnel == "1" && result.an_tunnel_teid != "" && result.an_tunnel_ip != ""

  modify.mas.n3_synchronized:
    parameters:
      - n3Synced: string
    evidence:
      requires:
        n3Synced: [mas::upn.n3-synchronized]
    evaluator:
      type: cel
      expression: n3Synced == "1"
