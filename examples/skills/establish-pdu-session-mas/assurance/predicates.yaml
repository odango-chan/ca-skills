# MAS v1alpha4 predicates. The shared snapshot Observation and async Owner
# result Schemas are unapproved design candidates, not published contracts.
predicates:
  establishment.request.supported:
    parameters:
      - requestType: integer
      - pduType: string
      - sscMode: integer
    evaluator:
      type: cel
      expression: requestType == 1 && pduType == "IPV4" && sscMode == 1

  establishment.mas.eligible:
    parameters:
      - result: mas::urn:example:mas:establishment-snapshot:v1
    evidence:
      requires:
        result: [mas::establishment.eligible]
    evaluator:
      type: cel
      expression: result.eligible == true

  establishment.mas.subscription_valid:
    parameters:
      - result: mas::urn:example:mas:establishment-snapshot:v1
    evidence:
      requires:
        result: [mas::establishment.subscription_valid]
    evaluator:
      type: cel
      expression: result.subscription_valid == true

