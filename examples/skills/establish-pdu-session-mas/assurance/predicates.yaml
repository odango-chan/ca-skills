# MAS v1alpha4 Predicate declarations. The MAS Owner output Schemas and
# guarantees below are EXAMPLE-ONLY candidates, never published/link-qualified.
# Each check reintroduces a named business gate from the legacy policy-first flow.
# Host admission, invocation/lifecycle correlation and persistence are not Skill Predicates.
predicates:
  establishment.request.supported:
    parameters:
      - requestType: integer
      - pduType: string
      - sscMode: integer
    evaluator:
      type: cel
      expression: requestType == 1 && pduType == "IPV4" && sscMode == 1

  establishment.mas.subscription_valid:
    parameters:
      - result: mas::urn:example:mas:subscription-state:v1
    evidence:
      requires:
        result: [mas::establishment.subscription_valid]
    evaluator:
      type: cel
      expression: result.subscription_valid == true

  establishment.mas.secondary_auth_resolved:
    parameters:
      - result: mas::urn:example:mas:secondary-auth-state:v1
    evidence:
      requires:
        result: [mas::establishment.secondary_auth_resolved]
    evaluator:
      type: cel
      expression: result.secondary_auth_resolved == true

  establishment.mas.context_ready:
