# v1alpha4 MAS policy-first DAG. Tool/Owner exports are NOT YET PUBLISHED.
# Host, not author Nodes, performs trusted mutation.reconcile when available.
# Host also owns ingress admission, invocation identity and lifecycle/correlation.
# The Agent queries only SMF-owned MAS context when an explicit Observation is needed;
# non-SMF context required by an Operation remains inside the responsible Tool.
# Host performs ingress admission, identity/instance association, duplicate suppression and execution lifecycle before this graph starts.
# This draft Skill validates only the business request profile; Host execution metadata is not a Procedure input.
start: validate-sm-subscription
nodes:
  # 3GPP: CA_ADAPTER — validates the Session Management Subscription associated with TS 23.502 §4.3.2.2.1 step 4; exact UDM retrieval/Owner contract is not published.
  validate-sm-subscription:
    # Global Skill gate: business request profile only. PASS advances to this Node's Operation.
    precondition:
      predicates:
        - predicate: establishment.request.supported
          arguments:
            - context.request.requestType
            - context.request.requestedPduSessionType
            - context.request.requestedSscMode
      routes:
        FAIL: FAILED
        UNKNOWN: UNRESOLVED
    operation:
      tool: mas::ca.pdu_session.subscription.validate
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        requestType: context.request.requestType
        dnn: context.request.dnn
        sNssai: context.request.sNssai
        servingPlmn: context.request.servingPlmn
        requestedPduSessionType: context.request.requestedPduSessionType
        requestedSscMode: context.request.requestedSscMode
      routes:
        FAILED: FAILED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    # Intermediate business gate retained from legacy; actual owner Evidence
    # is UNPUBLISHED, so positive completion is not yet trusted for linking.
    postcondition:
      predicates:
        - predicate: establishment.mas.subscription_valid
          arguments:
            - validate-sm-subscription.operation.output
      routes:
        PASS: resolve-secondary-authentication
        FAIL: FAILED
        UNKNOWN: SAFE_STOPPED
  # 3GPP: CA_ADAPTER — optional secondary authentication/authorization in TS 23.502 V18.12.0 §4.3.2.2.1 step 6; this MAS operation resolves the admitted profile's disposition.
  resolve-secondary-authentication:
    operation:
      tool: mas::ca.pdu_session.secondary_auth.disposition
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        requestType: context.request.requestType
        dnn: context.request.dnn
        sNssai: context.request.sNssai
        servingPlmn: context.request.servingPlmn
        requestedPduSessionType: context.request.requestedPduSessionType
        requestedSscMode: context.request.requestedSscMode
        subscriptionStateRef: validate-sm-subscription.operation.output.stateRef
        required: 0
      routes:
        FAILED: FAILED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    # Intermediate business gate retained from legacy; actual owner Evidence
    # is UNPUBLISHED, so positive completion is not yet trusted for linking.
    postcondition:
      predicates:
        - predicate: establishment.mas.secondary_auth_resolved
          arguments:
            - resolve-secondary-authentication.operation.output
      routes:
        PASS: create-sm-context
        FAIL: FAILED
        UNKNOWN: SAFE_STOPPED
  # 3GPP: CA_ADAPTER — SM context creation associated with TS 23.502 V18.12.0 §4.3.2.2.1 steps 3 and 5; this MAS callable is not itself Nsmf_PDUSession_CreateSMContext.
  create-sm-context:
    operation:
      tool: mas::ca.pdu_session.context.create
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        requestType: context.request.requestType
        dnn: context.request.dnn
        sNssai: context.request.sNssai
        servingPlmn: context.request.servingPlmn
        requestedPduSessionType: context.request.requestedPduSessionType
        requestedSscMode: context.request.requestedSscMode
        subscriptionStateRef: validate-sm-subscription.operation.output.stateRef
        authStateRef: resolve-secondary-authentication.operation.output.stateRef
        subSummary: validate-sm-subscription.operation.output.sub_summary
      routes:
        FAILED: ca-compensate-confirmed-failure
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    # Intermediate business gate retained from legacy; actual owner Evidence
    # is UNPUBLISHED, so positive completion is not yet trusted for linking.
