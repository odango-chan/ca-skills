# CA-SL v1alpha4 MAS policy-first DAG, source-aligned to the OpenAMSM OES plan.
# All MAS callable IDs, Schemas and Evidence Guarantees are candidate references only;
# no trusted MAS ToolCatalog / CapabilityContracts publication exists yet.
# Host/Owner owns admission, exact UE/PSI binding, pending-operation correlation,
# mutation.reconcile and resource responsibility. No authored Wait or Reconcile Node.
start: read-existing-sm-context
nodes:
  # CA_EXTENSION — exact UE/PSI existence check before any session-creating or
  # session-mutating operation. 404 SESSION_NOT_FOUND is normalized by the Host
  # generic Observation adapter to sessionPresence=ABSENT. 200 AVAILABLE and
  # 200 UNAVAILABLE both mean PRESENT. Query/transport errors remain UNKNOWN.
  read-existing-sm-context:
    precondition:
      predicates:
        - predicate: establishment.request.supported
          arguments:
            - context.request.requestType
            - context.request.requestedPduSessionType
            - context.request.requestedSscMode
      routes:
        FAIL: FAILED
        UNKNOWN: UNRESOLVED
    observation:
      tool: ca-observations::context.smf.session.read
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
      routes:
        FAILED: UNRESOLVED
        UNKNOWN: UNRESOLVED
    postcondition:
      predicates:
        - predicate: establishment.smf.session_context_absent
          arguments:
            - read-existing-sm-context.observation.output
      routes:
        PASS: validate-sm-subscription
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # OpenAMSM OES: SC.VALIDATE_SUBSCRIPTION (NW Agent Plan s1).
  # The adapter resolves ueRef to the private ue_identity and maps PSI/S-NSSAI.
  # The source output exposed by the plan is sub_summary ("ok" on validation).
  # This is a CA adapter around the SMF's UDM SDM Get path, not a new 3GPP API.
  validate-sm-subscription:
    operation:
      tool: mas::SC.VALIDATE_SUBSCRIPTION
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        dnn: context.request.dnn
        sNssai: context.request.sNssai
      routes:
        FAILED: FAILED
        OUTCOME_UNKNOWN: UNRESOLVED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.mas.subscription_validated
          arguments:
            - validate-sm-subscription.operation.output
      routes:
        PASS: skip-secondary-authentication
        FAIL: FAILED
        UNKNOWN: SAFE_STOPPED

  # OpenAMSM OES: SAA.SECONDARY_AUTH (s2, optional). The current plan hard-codes
  # required="0"; this operation therefore returns phase=SKIPPED. It is not a
  # dynamic secondary-auth decision and this Skill excludes auth-required profiles.
  skip-secondary-authentication:
    operation:
      tool: mas::SAA.SECONDARY_AUTH
      arguments:
        ueRef: context.ueRef
        required: "0"
      routes:
        FAILED: FAILED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.mas.secondary_auth_skipped
          arguments:
            - skip-secondary-authentication.operation.output
      routes:
        PASS: create-sm-context
        FAIL: FAILED
        UNKNOWN: SAFE_STOPPED

  # OpenAMSM OES: SC.CREATE_SM_CONTEXT (s3). This is the internal context
  # creation that supports the paired CreateSMContext service boundary; the
  # early step-5 response is not proof of final PDU Session establishment.
  create-sm-context:
    operation:
      tool: mas::SC.CREATE_SM_CONTEXT
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        dnn: context.request.dnn
        sNssai: context.request.sNssai
        subSummary: validate-sm-subscription.operation.output.sub_summary
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.mas.context_created
          arguments:
            - create-sm-context.operation.output
      routes:
        PASS: register-uecm
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # OpenAMSM OES: SC.REGISTER_UECM (s3r). The MAS plan places this before PCF/N4;
  # that is an explicit ordering deviation from TS 23.502 step 16c.
  register-uecm:
    operation:
      tool: mas::SC.REGISTER_UECM
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        sessionKeys: create-sm-context.operation.output.session_keys
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.mas.uecm_registered
          arguments:
            - register-uecm.operation.output
      routes:
        PASS: establish-sm-policy-association
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # OpenAMSM OES: PA.CREATE_SM_POLICY (s3p), the MAS adapter for PCF policy
  # association creation. The Owner must return the real association identity;
  # the source fallback "bound" is not an acceptable resource identity.
  establish-sm-policy-association:
    operation:
      tool: mas::PA.CREATE_SM_POLICY
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        dnn: context.request.dnn
        sNssai: context.request.sNssai
        pduSessionType: context.request.requestedPduSessionType
        sessionKeys: create-sm-context.operation.output.session_keys
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.mas.policy_association_created
          arguments:
            - establish-sm-policy-association.operation.output
      routes:
        PASS: select-upf-anchor
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # OpenAMSM OES: UPS.DECIDE_ANCHOR (s4). The source output up_anchor is a
  # "1"/"0" readiness marker; the selected PFCP node remains SMF-internal.
  select-upf-anchor:
    operation:
      tool: mas::UPS.DECIDE_ANCHOR
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        dnn: context.request.dnn
        sNssai: context.request.sNssai
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.mas.anchor_selected
          arguments:
            - select-upf-anchor.operation.output
      routes:
        PASS: allocate-pdu-session-address
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # OpenAMSM OES: IAM.ALLOCATE_ADDRESS (s5), allocator=LOCAL_POOL.
  # ue_addr is a "1"/"0" allocation marker, not the actual UE IP address.
  # The real address stays in the SMF session and is consumed inside later Owners.
  allocate-pdu-session-address:
    operation:
      tool: mas::IAM.ALLOCATE_ADDRESS
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        dnn: context.request.dnn
        allocator: "LOCAL_POOL"
        upAnchorReady: select-upf-anchor.operation.output.up_anchor
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.mas.address_allocated
          arguments:
            - allocate-pdu-session-address.operation.output
      routes:
        PASS: modify-sm-policy-association
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # OpenAMSM OES: PA.UPDATE_SM_POLICY (s6u). The Owner consumes the allocation
  # marker and exact policy association; it does not receive a fabricated UE IP.
  modify-sm-policy-association:
    operation:
      tool: mas::PA.UPDATE_SM_POLICY
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        dnn: context.request.dnn
        sNssai: context.request.sNssai
        pduSessionType: context.request.requestedPduSessionType
        sessionKeys: create-sm-context.operation.output.session_keys
        ueAddrAllocated: allocate-pdu-session-address.operation.output.ue_addr
        policyAssociationId: establish-sm-policy-association.operation.output.policy_assoc_id
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.mas.policy_updated
          arguments:
            - modify-sm-policy-association.operation.output
      routes:
        PASS: create-charging-reservation
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # OpenAMSM OES: CA.CREATE_CHARGING (s7). The current implementation is an
  # explicit NOT_IMPL_skip stub returning charging_ref="1". It is retained as a
  # qualification gate, not accepted as proof of a charging reservation.
  create-charging-reservation:
    operation:
      tool: mas::CA.CREATE_CHARGING
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        ratingGroupRefs: "default"
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.mas.charging_reservation_created
          arguments:
            - create-charging-reservation.operation.output
      routes:
        PASS: establish-n4-session
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # OpenAMSM OES: UPN.CREATE_UP_SESSION (s8). Step-8 UPF selection and address
  # allocation are already represented by UPS/IAM; the actual UPF/UE IP remain
  # inside the SMF session. n4_seid is the single UPF SEID, not an N4 SEID pair.
  establish-n4-session:
    operation:
      tool: mas::UPN.CREATE_UP_SESSION
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        upIntent: modify-sm-policy-association.operation.output.up_intent
        upAnchorReady: select-upf-anchor.operation.output.up_anchor
        ueAddrAllocated: allocate-pdu-session-address.operation.output.ue_addr
        dnn: context.request.dnn
        sNssai: context.request.sNssai
        pduSessionType: context.request.requestedPduSessionType
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.mas.n4_session_established
          arguments:
            - establish-n4-session.operation.output
      routes:
        PASS: signal-ue-and-access-network
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # OpenAMSM OES: SSM.SIGNAL_UE_AN (s10). This sends the N1/N2 transfer and may
  # remain pending until the exact later step-15 UpdateSMContext result supplies
  # the RAN F-TEID. Host correlates that request to this Operation; Runtime
  # resumes this same Invocation. The AMF transfer ACK alone is not adoption.
  signal-ue-and-access-network:
    operation:
      tool: mas::SSM.SIGNAL_UE_AN
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        sessionKeys: create-sm-context.operation.output.session_keys
        ueAddrAllocated: allocate-pdu-session-address.operation.output.ue_addr
        n4Seid: establish-n4-session.operation.output.n4_seid
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.mas.access_network_ready
          arguments:
            - signal-ue-and-access-network.operation.output
      routes:
        PASS: modify-n4-session
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # OpenAMSM OES: UPN.MODIFY_UP_SESSION (s11), the separate N4 Modification
  # proof boundary. It consumes the RAN F-TEID returned by the pending SSM call.
  modify-n4-session:
    operation:
      tool: mas::UPN.MODIFY_UP_SESSION
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        anTunnelTeid: signal-ue-and-access-network.operation.output.an_tunnel_teid
        anTunnelIp: signal-ue-and-access-network.operation.output.an_tunnel_ip
        n4Seid: establish-n4-session.operation.output.n4_seid
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.mas.n3_synchronized
          arguments:
            - modify-n4-session.operation.output
      routes:
        PASS: record-session-establishment-event
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # OpenAMSM OES: SE.EMIT_EVENTS (s13). The current source records a local MAS
  # event and returns last_event="1"; this is not TS 23.502 step-18 notification.
  record-session-establishment-event:
    operation:
      tool: mas::SE.EMIT_EVENTS
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        event: "ESTABLISHED"
        sessionKeys: create-sm-context.operation.output.session_keys
      routes:
        FAILED: SAFE_STOPPED
        OUTCOME_UNKNOWN: SAFE_STOPPED
        DENIED: SAFE_STOPPED
    postcondition:
      predicates:
        - predicate: establishment.mas.establishment_event_recorded
          arguments:
            - record-session-establishment-event.operation.output
      routes:
        PASS: verify-pdu-session-establishment
        FAIL: SAFE_STOPPED
        UNKNOWN: SAFE_STOPPED

  # Final business proof. Host resource responsibility remains a separate
  # terminal gate; no Skill-authored resources.finalize or compensation Node.
  verify-pdu-session-establishment:
    postcondition:
      predicates:
        - predicate: establishment.mas.subscription_validated
          arguments:
            - validate-sm-subscription.operation.output
        - predicate: establishment.mas.secondary_auth_skipped
          arguments:
            - skip-secondary-authentication.operation.output
        - predicate: establishment.mas.context_created
          arguments:
            - create-sm-context.operation.output
        - predicate: establishment.mas.uecm_registered
          arguments:
            - register-uecm.operation.output
        - predicate: establishment.mas.policy_association_created
          arguments:
            - establish-sm-policy-association.operation.output
        - predicate: establishment.mas.anchor_selected
          arguments:
            - select-upf-anchor.operation.output
        - predicate: establishment.mas.address_allocated
          arguments:
            - allocate-pdu-session-address.operation.output
        - predicate: establishment.mas.policy_updated
          arguments:
            - modify-sm-policy-association.operation.output
        - predicate: establishment.mas.charging_reservation_created
          arguments:
            - create-charging-reservation.operation.output
        - predicate: establishment.mas.n4_session_established
          arguments:
            - establish-n4-session.operation.output
        - predicate: establishment.mas.access_network_ready
          arguments:
            - signal-ue-and-access-network.operation.output
        - predicate: establishment.mas.n3_synchronized
          arguments:
            - modify-n4-session.operation.output
        - predicate: establishment.mas.establishment_event_recorded
          arguments:
            - record-session-establishment-event.operation.output
      routes:
        PASS: SUCCEEDED
        FAIL: SAFE_STOPPED
        UNKNOWN: UNRESOLVED
