        FAIL: ca-compensate-confirmed-failure
        UNKNOWN: SAFE_STOPPED
  # 3GPP: CA_ADAPTER — TS 23.502 V18.12.0 §4.3.2.2.1 step 7b; SM Policy Association Establishment / Npcf_SMPolicyControl_Create. The MAS callable remains unpublished.
  establish-sm-policy-association:
    operation:
