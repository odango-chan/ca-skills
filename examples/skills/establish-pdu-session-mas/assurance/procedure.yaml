      routes:
        PASS: ca-register-uecm
        FAIL: ca-compensate-confirmed-failure
        UNKNOWN: SAFE_STOPPED
  # 3GPP: CA_ADAPTER — uses UDM UECM registration semantics. Note: this MAS graph places it before policy/N4, unlike TS 23.502 §4.3.2.2.1 step 16c; this is a proposed MAS ordering deviation, not the standard sequence.
  ca-register-uecm:
    operation:
      tool: mas::ca.pdu_session.uecm.register
      arguments:
        ueRef: context.ueRef
        pduSessionId: context.request.pduSessionId
        pti: context.request.pti
        requestType: context.request.requestType
        dnn: context.request.dnn
