        servingPlmn: context.request.servingPlmn
        requestedPduSessionType: context.request.requestedPduSessionType
        requestedSscMode: context.request.requestedSscMode
        contextStateRef: create-sm-context.operation.output.stateRef
        subscriptionStateRef: validate-sm-subscription.operation.output.stateRef
        sessionKeys: create-sm-context.operation.output.session_keys
      routes:
        FAILED: ca-compensate-confirmed-failure
        OUTCOME_UNKNOWN: SAFE_STOPPED
