  # 3GPP: CA_ADAPTER — TS 23.502 V18.12.0 §4.3.2.2.1 step 9; SMF-initiated SM Policy Association Modification / Npcf_SMPolicyControl_Update. The MAS callable is unpublished.
  modify-sm-policy-association:
