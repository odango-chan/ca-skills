apiVersion: experiment.connectionagent.io/v1alpha1
kind: CommonRuleSetPrototype
metadata:
  name: ca-skill-common
  note: D1 experiment only; not current machine syntax
spec:
  rules:
    - id: context.runtime_state.no_fabrication
      title: Runtime state must not be fabricated
      subject: MODEL_PROPOSAL
      category: grounding
      severity: hard
      statement: >
        运行时状态必须来自受信运行时上下文或 Observation；模型不得从静态身份、历史样例或常识中复制、推导或猜测当前运行时值。
      violation:
        code: INVENTED_RUNTIME_STATE

    - id: context.required.no_guess
      title: Required context must not be guessed
      subject: MODEL_PROPOSAL
      category: context_integrity
      severity: hard
      statement: >
        当完成当前决策所需的必需上下文缺失或歧义时，模型不得自行补造该值；应请求上下文或返回相应的受控状态。
      violation:
        code: MISSING_REQUIRED_CONTEXT
